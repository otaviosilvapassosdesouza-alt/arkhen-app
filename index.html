};
const TAGS_BASE = '#gestaoempresarial #consultoriaempresarial #donodeempresa #empreendedorismo';
const GRAV_SENTADO = 'Sentado no escritório, câmera na altura dos olhos, enquadramento do peito para cima. Fundo escuro ou desfocado (modo retrato). Luz de frente.';
const GRAV_REACT = 'Sentado. No app Edits ou CapCut, use tela dividida: trecho curto do vídeo original em cima (até 5 segundos, com crédito ao autor) e você embaixo dando sua opinião.';
const GRAV_MEET = 'Grave a tela do Google Meet com você falando e a planilha ou slide compartilhado. Cliente fora do quadro e números sem identificação, ou recrie a explicação sozinho na mesma tela.';
const ARTE = 'Sem gravação. Arte no Canva com a identidade da Arkhen: verde-escuro, creme e laranja, tipografia grande, uma ideia por slide.';

const MKT_POSTS = [
{d:'2026-10-27',f:'Carrossel',p:'visao',t:'Por que você virou o teto da sua empresa',dur:'10 slides',g:`Capa: "Sua empresa fatura. Mas não sobra. E o motivo pode ser você."`,tela:`Capa em fundo verde-escuro, texto grande. Slides seguintes em fundo creme, uma ideia por slide.`,rot:[`1. Sua empresa fatura. Mas não sobra. E o motivo pode ser você.`,`2. Veja se você reconhece este dia: você abre a empresa, aprova orçamento, responde cliente no WhatsApp, resolve um problema de funcionário, apaga um incêndio com fornecedor. À noite, sozinho, tenta entender o financeiro.`,`3. Até certo tamanho, isso funciona. Você é o melhor vendedor, o melhor técnico e o controle financeiro está todo na sua cabeça. A empresa cresce justamente porque você está em tudo.`,`4. Só que existe um ponto, geralmente entre R$ 50 mil e R$ 80 mil por mês, em que a sua cabeça vira o limite. Cada decisão espera por você. A empresa passa a crescer só até onde as suas horas alcançam.`,`5. Os sintomas aparecem juntos: você contrata mais gente, mas ninguém decide nada sem você. A margem cai porque ninguém olha custo. O caixa aperta mesmo com o faturamento subindo.`,`6. A resposta mais comum é trabalhar mais. Mais horas, mais WhatsApp, mais fim de semana. E o problema piora, porque a empresa fica ainda mais dependente de você.`,`7. O que resolve é tirar da sua cabeça e colocar em estrutura o que hoje só você sabe: os números, os processos e quem pode decidir o quê.`,`8. A ordem importa. Primeiro o financeiro, para saber o que realmente sobra. Depois o comercial, para vender com previsibilidade. Depois processos e pessoas, para a operação rodar sem você.`,`9. Eu sou o Luiz Otávio, da Arkhen. Meu trabalho é entrar nas empresas, mapear o que trava e estruturar isso junto com o dono. Online, para empresas de todo o Brasil.`,`10. Aqui você vai encontrar contas, casos e opiniões que nem todo empresário gosta de ouvir. Nada de motivação. Se você se viu no slide 2, siga.`],grav:ARTE,leg:`Vou recomeçar este perfil com a conversa que eu mais tenho com donos de empresa.\n\nQuase todo empresário que eu conheço trabalha muito. O problema raramente é esforço. O problema é que a empresa cresceu mais rápido do que a estrutura dela, e o dono virou a peça que segura tudo.\n\nIsso funciona até certo ponto. Depois, cada nova venda, cada novo funcionário e cada novo cliente passam a depender das mesmas 24 horas do dono. A empresa para de crescer e ninguém entende por quê, já que o faturamento até subiu.\n\nA saída não é trabalhar mais. É transferir para números, processos e responsabilidades claras aquilo que hoje só existe na sua cabeça.\n\nÉ sobre isso que eu vou falar aqui: gestão sem romantismo, com número na mesa e visão de longo prazo.\n\nSe você é dono e se reconheceu no slide 2, me conta nos comentários qual parte do seu dia você mais gostaria de tirar das suas costas.`,cta:'Comentar e seguir',tags:TAGS_BASE},
{d:'2026-10-28',f:'Estático',p:'tese',t:'Crescer no faturamento pode ser crescer o problema',dur:'1 imagem + legenda longa',g:`"Empresa que só cresce no faturamento está crescendo o problema."`,tela:`A frase centralizada sobre fundo verde-escuro. Assinatura Arkhen discreta no rodapé.`,rot:[`Arte única com a frase. A profundidade vai na legenda.`],grav:ARTE,leg:`Essa frase incomoda porque contraria a lógica que a gente aprende: vender mais é sempre bom.\n\nVender mais é bom quando cada venda deixa dinheiro. Quando não deixa, crescer só aumenta o tamanho do problema.\n\nVeja um caso típico. Uma empresa fatura R$ 80 mil por mês com margem líquida de 12%. Sobram R$ 9.600. O dono decide crescer: contrata dois vendedores, investe em anúncio, dá desconto para fechar mais contratos e alonga o prazo de pagamento para o cliente.\n\nSeis meses depois, a empresa fatura R$ 120 mil. Todo mundo comemora. Só que a margem caiu para 5%, por causa dos descontos, das comissões e da estrutura maior. Sobram R$ 6 mil. A empresa ficou 50% maior e passou a lucrar menos.\n\nE tem um efeito pior, que quase ninguém percebe: o caixa. Vendendo mais a prazo, mais dinheiro fica preso na mão dos clientes, enquanto folha, fornecedor e impostos continuam vencendo todo mês. A empresa cresce e o dono passa a viver no cheque especial.\n\nCrescimento saudável vem depois de três respostas: quanto sobra de cada venda, quantos dias o dinheiro fica fora da empresa e qual estrutura aguenta o volume novo.\n\nVocê sabe quanto sobrou na sua empresa no mês passado, em reais? Responde aqui embaixo, sincero.`,cta:'Comentar',tags:TAGS_BASE+' #gestaofinanceira'},
{d:'2026-10-29',f:'Carrossel',p:'prova',t:'Caso Arkhen #01: pet shop',dur:'9 slides',g:`Capa: "Caso Arkhen #01. A dona fazia tudo. Veja o que mudou em [X] meses."`,tela:`Formato de relatório: cabeçalho "DIAGNÓSTICO ARKHEN • CASO 01", fundo creme, números em destaque laranja.`,rot:[`1. Capa: "Caso Arkhen #01. A dona fazia tudo. Veja o que mudou em [X] meses."`,`2. O ponto de partida: [segmento, tempo de mercado, tamanho da equipe, faixa de faturamento]. A dona [descreva em 2 linhas como era a rotina dela].`,`3. O que ela achava que era o problema: [ex.: "preciso de mais clientes"].`,`4. O que o diagnóstico mostrou: problema 1 [com impacto em R$ ou em horas].`,`5. Problema 2 [com impacto]. Problema 3 [com impacto].`,`6. O que estruturamos, e em que ordem: [ex.: controle de caixa semanal, agenda recorrente, funções definidas no time].`,`7. O que foi difícil: [a resistência real que apareceu no processo]. Esse slide dá credibilidade, porque ninguém acredita em caso sem atrito.`,`8. Resultado: [antes e depois em números reais].`,`9. "Toda empresa tem uma versão desse diagnóstico. Quer saber qual é a sua? Me manda ESTRUTURA no direct."`],grav:`Sem gravação. Peça autorização à cliente e publique em Collab.`,leg:`Caso Arkhen #01.\n\n[Conte em 4 a 6 linhas: como a empresa estava, o que a dona acreditava ser o problema, o que os números mostraram e o que mudou.]\n\nO que eu quero que você perceba neste caso é a diferença entre o problema que o dono sente e o problema que os números mostram. Quase sempre são diferentes.\n\nObrigado pela confiança, @[perfil da cliente].`,cta:'Collab com a cliente',tags:TAGS_BASE,nota:'Preencha com números reais. Se a cliente não autorizar o nome, publique como "pet shop no interior de Goiás", sem marcar.'},
{d:'2026-10-30',f:'Carrossel',p:'metodo',t:'Lucro × Caixa: por que falta dinheiro mesmo com lucro',dur:'10 slides',g:`Capa: "Sua empresa deu lucro em outubro. Então por que, no dia 10, não tinha dinheiro para pagar a folha?"`,tela:`Capa com a pergunta. Slide 6 com o desenho dos 4 quadrantes. Slide 8 com a fórmula do ciclo financeiro em destaque.`,rot:[`1. Sua empresa deu lucro em outubro. Então por que, no dia 10, não tinha dinheiro para pagar a folha?`,`2. A cena é comum. O contador fecha o mês e mostra R$ 15 mil de lucro. Você abre o banco e está no cheque especial. Os dois estão certos. E é exatamente isso que ninguém te explicou.`,`3. Lucro é o resultado do que você vendeu no mês, menos o que custou para vender. Caixa é o dinheiro que entrou de fato na conta. Uma venda parcelada em 3x entra inteira no lucro de hoje, mas só entra no caixa ao longo dos próximos 3 meses.`,`4. Exemplo: você vendeu R$ 100 mil em outubro, mas só R$ 40 mil foram à vista. O resto vence em 30, 60 e 90 dias. Enquanto isso, fornecedor, folha, aluguel e impostos somaram R$ 85 mil e saíram quase todos no mês. No papel, lucro de R$ 15 mil. No banco, R$ 45 mil a menos.`,`5. Aqui está a armadilha: quanto mais você cresce vendendo a prazo, mais dinheiro fica preso na rua.`,`6. Por isso, no diagnóstico, eu não olho só o lucro. Eu cruzo lucro e caixa e coloco a empresa em um destes quatro quadrantes: saudável, rentável mas asfixiada, sustentada pelo caixa ou em colapso.`,`7. O segundo quadrante, rentável mas asfixiada, é o mais traiçoeiro. Os sinais: usa cheque especial ou antecipação todo mês, paga juros mesmo tendo lucro e coloca dinheiro pessoal na empresa.`,`8. A conta: ciclo financeiro = prazo médio de recebimento + prazo médio de estoque - prazo médio de pagamento. Se você recebe em 45 dias, o estoque fica parado 30 dias e você paga o fornecedor em 28, são 47 dias em que a sua empresa banca a operação sozinha.`,`9. O que se faz: encurtar o recebimento, ou cobrar o custo do parcelamento no preço. Alongar o prazo com fornecedor. Antecipar recebíveis só com critério, sabendo quanto custa.`,`10. Lucro mostra se o modelo de negócio funciona. Caixa mostra se a empresa sobrevive até o lucro chegar. Você precisa dos dois. Salva este post e calcula hoje o seu ciclo financeiro.`],grav:ARTE,leg:`Essa é a conversa que eu mais tenho na primeira reunião com um dono de empresa: "Luiz, eu não entendo, o contador diz que dá lucro."\n\nEle não está mentindo, e você também não. Lucro é competência, caixa é calendário.\n\nO primeiro passo é parar de olhar só um número.\n\nFaça a conta do slide 8 com os seus prazos e me conta nos comentários quantos dias deu.`,cta:'Salvar e comentar os dias do ciclo',tags:TAGS_BASE+' #fluxodecaixa',nota:'Versão aprovada por você.'},
{d:'2026-10-31',f:'Estático',p:'tese',t:'Se a empresa para nas suas férias',dur:'1 imagem + legenda longa',g:`"Se a sua empresa para quando você tira férias, você não tem uma empresa. Tem uma dependência com CNPJ."`,tela:`Frase sobre fundo verde-escuro, "dependência com CNPJ" em laranja.`,rot:[`Arte única. A profundidade vai na legenda.`],grav:ARTE,leg:`Faça um teste mental agora: se você sumisse por 15 dias, sem celular, o que pararia na sua empresa?\n\nPara a maioria dos donos que eu atendo, a lista é longa. Orçamento não sai. Desconto não é aprovado. Fornecedor não é pago porque só o dono tem a senha do banco. Cliente insatisfeito fica sem resposta.\n\nIsso não acontece porque o time é ruim. Acontece por três motivos:\n\n1. O processo está só na cabeça do dono.\n2. Ninguém tem alçada.\n3. O dono centraliza por medo de erro.\n\nPara começar a sair disso:\n• Liste as 10 decisões que mais te interrompem na semana.\n• Defina, para cada uma, quem pode decidir e até que limite.\n• Escreva o passo a passo das 3 tarefas que só você sabe fazer.\n\nEm 30 dias, a empresa já para menos quando você sai.\n\nQuando foi a última vez que você tirou 15 dias de férias de verdade?`,cta:'Comentar',tags:TAGS_BASE+' #processos'},
{d:'2026-11-01',f:'Carrossel',p:'convite',t:'Como a Arkhen trabalha (e por que não é só um relatório)',dur:'10 slides',g:`Capa: "A maioria das consultorias entrega um relatório bonito e some. Eu trabalho diferente."`,tela:`Capa com a frase. Slides 3 a 7 com a sigla DPERC em destaque, uma etapa por slide.`,rot:[`1. A maioria das consultorias entrega um relatório bonito e some. Eu trabalho diferente.`,`2. O problema do relatório que fica na gaveta é que ele diz o que fazer, mas ninguém da empresa sabe como fazer.`,`3. D, de Diagnóstico. Em até 30 dias, a gente levanta documentos, entrevista o dono e a equipe, cruza os números e entrega os 3 maiores problemas da empresa, com o impacto de cada um em reais.`,`4. P, de Planejamento. Prioridades, prazos e responsáveis, combinados com o dono. Escopo definido pelo problema real, não por um pacote pronto.`,`5. E, de Execução. Para cada processo: a gente ensina, demonstra, documenta, o time faz, a gente observa e depois audita. Até virar rotina.`,`6. R, de Resultados. Relatório semanal, reunião quinzenal e, no quarto mês, a comparação entre o ponto A e o ponto B, em números.`,`7. C, de Continuidade. O objetivo é a empresa ficar autônoma, não dependente da consultoria.`,`8. Como funciona na prática: 100% online, pelo Google Meet, com todas as sessões gravadas e entregues ao cliente. Atendo empresas de todo o Brasil.`,`9. Para quem é: donos de empresas que faturam entre R$ 20 mil e R$ 200 mil por mês, com time formado, e que estão dispostos a participar.`,`10. Se fizer sentido para você, me manda ESTRUTURA no direct e a gente conversa.`],grav:ARTE,leg:`Muita gente me pergunta o que exatamente uma consultoria faz. Então vou abrir aqui como a Arkhen trabalha.\n\nO ponto central é este: diagnóstico sem implementação não muda empresa. Saber o que está errado é o começo. O trabalho de verdade é fazer a mudança acontecer na rotina.\n\nSe você quer entender se faz sentido para a sua empresa, me manda ESTRUTURA no direct.`,cta:'Mandar ESTRUTURA no direct',tags:TAGS_BASE},
{d:'2026-11-02',f:'Reel',p:'tese',t:'Você não tem problema de venda. Tem problema de margem',dur:'75-90s',g:`"Toda semana um dono de empresa me diz: 'Luiz, eu preciso vender mais.' E quase nunca é isso."`,tela:`168 vendas → 107 vendas. Mesmo cliente. Sem desconto.`,rot:[`"Toda semana um dono de empresa me diz: 'Luiz, eu preciso vender mais.' E quase nunca é isso.`,`Deixa eu te mostrar com números. Uma empresa de serviço cobra R$ 1.200, mas dá 10% de desconto para fechar. Então recebe R$ 1.080. Desse valor saem 6% de imposto, 5% de comissão, 3% de taxa de cartão e R$ 750 de custo direto. Sobram uns R$ 179 por venda.`,`Se os custos fixos dessa empresa são R$ 30 mil por mês, ela precisa de 168 vendas só para empatar. Ela faz 120. Então o dono conclui: preciso vender mais.`,`Agora tira o desconto. A mesma venda deixa R$ 282. O ponto de equilíbrio cai de 168 para 107 vendas. Com as mesmas 120 vendas de hoje, a empresa sai do prejuízo e passa a lucrar. Sem um cliente a mais.`,`O problema nunca foi volume. Foi um desconto que virou padrão porque ninguém fez essa conta.`,`Antes de pensar em vender mais, descubra quanto sobra de cada venda. Se você não sabe, comenta MARGEM que eu te mostro como calcular."`],grav:GRAV_SENTADO,leg:`Vender mais não conserta margem errada. Só multiplica o erro.\n\nFaça este exercício com o seu produto ou serviço que mais vende:\n1. Preço real recebido (já com o desconto que você costuma dar)\n2. Menos impostos, comissão e taxas\n3. Menos o custo direto\nO que sobra é a sua margem de contribuição. Divida os seus custos fixos por ela e você tem quantas vendas precisa só para empatar.\n\nComenta MARGEM se quiser que eu detalhe essa conta.`,cta:'Comentar MARGEM',tags:TAGS_BASE+' #precificacao',nota:'Versão aprovada por você.'},
{d:'2026-11-03',f:'Carrossel',p:'metodo',t:'Black Friday: a conta que você precisa fazer antes de dar desconto',dur:'10 slides',g:`Capa: "Deu 20% de desconto? Você vai precisar vender o DOBRO para lucrar o mesmo."`,tela:`Capa com "o DOBRO" em laranja. Slides 3 e 4 com a conta montada como numa planilha.`,rot:[`1. Deu 20% de desconto? Você vai precisar vender o DOBRO para lucrar o mesmo.`,`2. Parece exagero, mas é matemática. O desconto não sai do preço. Sai da margem.`,`3. Exemplo: produto vendido a R$ 100, que custa R$ 60 entre mercadoria, imposto e taxas. Sobram R$ 40 por unidade.`,`4. Com 10% de desconto, você vende a R$ 90 e sobram R$ 30. Para fazer os mesmos R$ 40, precisa vender 33% a mais. Com 20% de desconto, sobram R$ 20. Precisa vender o dobro.`,`5. A fórmula: margem atual ÷ margem com desconto = quantas vezes mais você precisa vender. 40 ÷ 20 = 2. Faça essa conta para cada produto antes de montar a promoção.`,`6. E tem o caixa. Se a venda da Black Friday é parcelada, o desconto sai hoje e o dinheiro entra em parcelas.`,`7. Onde o desconto faz sentido: produto com margem alta, estoque parado ou item de entrada que puxa a venda de outro com margem melhor.`,`8. Alternativas: kit com produto de margem alta, brinde de baixo custo, condição de pagamento, frete ou bônus no serviço.`,`9. Na segunda-feira depois da Black Friday, não olhe só o faturamento. Olhe a margem por pedido, quanto foi parcelado e quanto de estoque saiu.`,`10. Manda este post para quem vai entrar na Black Friday sem fazer essa conta.`],grav:ARTE,leg:`Black Friday é o dia do ano em que mais empresa vende muito e lucra pouco.\n\nO desconto não sai do preço. Sai da margem. Quando a margem é de 40%, um desconto de 20% leva metade dela embora.\n\nIsso não quer dizer que você não deve participar. Quer dizer que a promoção precisa ser montada produto por produto, com conta feita.\n\nSalva e manda para um amigo que tem loja.`,cta:'Salvar e compartilhar',tags:TAGS_BASE+' #blackfriday'},
{d:'2026-11-04',f:'Estático',p:'tese',t:'Desconto é a forma mais cara de vender',dur:'1 imagem + legenda longa',g:`"Desconto é a forma mais cara de vender."`,tela:`Frase única sobre fundo verde-escuro.`,rot:[`Arte única. A profundidade vai na legenda.`],grav:ARTE,leg:`Todo desconto tem três custos. Só um aparece na hora.\n\nO primeiro é o da margem. Se a sua margem de contribuição é de 30% e você dá 10% de desconto, ela cai para 20%.\n\nO segundo é a âncora. O cliente que comprou com desconto passa a considerar aquele o preço justo.\n\nO terceiro é o tipo de cliente que você atrai. Quem decide por preço é quem mais negocia, mais reclama e menos fica.\n\nNa sua empresa, quantas das vendas do mês passado saíram com desconto?`,cta:'Comentar',tags:TAGS_BASE+' #vendas'},
{d:'2026-11-05',f:'Reel',p:'react',t:'Reagindo: "área da felicidade na empresa é uma balela"',dur:'70-80s',g:`"Concordo com ela. Mas pelo motivo que quase ninguém fala."`,tela:`Por que gente boa sai da sua empresa?`,rot:[`[Trecho de 3 a 5 segundos do vídeo de referência, com crédito.]`,`"Concordo com ela. Mas pelo motivo que quase ninguém fala.`,`Não é que bem-estar não importe. É que nenhuma empresa segura gente boa com mesa de pingue-pongue ou café especial.`,`Quando eu faço o diagnóstico de pessoas de uma empresa, os motivos de saída quase nunca são esses. São três: a pessoa não sabe exatamente o que se espera dela, não sabe como está sendo avaliada e não enxerga para onde pode crescer.`,`Repara que nenhum desses três custa dinheiro. Função escrita, meta clara e uma conversa de retorno a cada mês resolvem mais do que qualquer benefício de vitrine.`,`E tem um quarto motivo: o funcionário bom vai embora quando percebe que o funcionário ruim não tem consequência nenhuma.`,`Então, sim, área da felicidade é balela. Mas porque felicidade no trabalho é consequência de gestão, não um departamento."`],grav:GRAV_REACT,leg:`Reter gente boa é muito menos sobre benefício e muito mais sobre clareza.\n\nNos diagnósticos de pessoas que eu faço, as perguntas que mais revelam são simples: o que acontece se você tirar 30 dias de férias? Como você avalia o desempenho da equipe hoje?\n\nO que mais faz um bom funcionário ficar na sua empresa?`,cta:'Comentar',tags:TAGS_BASE+' #gestaodepessoas',nota:'Referência do seu grupo "Ideias de Vídeos". Use um trecho curto e dê crédito ao autor.'},
{d:'2026-11-06',f:'Carrossel',p:'prova',t:'Raio-X de um diagnóstico real',dur:'9 slides',g:`Capa: "Faturava R$ [X] mil por mês. O dono achava que a margem era [Y]%. Era [Z]%."`,tela:`Formato de relatório: "RAIO-X DE DIAGNÓSTICO • EMPRESA NÃO IDENTIFICADA".`,rot:[`1. Capa com faturamento, margem que o dono imaginava e margem real.`,`2. A empresa: [segmento, porte, tempo de mercado, tamanho do time]. Sem nome.`,`3. Por que o dono procurou ajuda: [a queixa dele, com as palavras dele].`,`4. Em que quadrante Lucro × Caixa ela estava, e como a gente descobriu.`,`5. Problema 1 encontrado e quanto custava por mês.`,`6. Problema 2 e quanto custava por mês.`,`7. Problema 3 e quanto custava por mês.`,`8. As 3 prioridades definidas para os primeiros 90 dias, e por que nessa ordem.`,`9. "O dono achava que precisava de mais vendas. Os números mostraram outra coisa. É por isso que tudo começa pelo diagnóstico."`],grav:`Sem gravação. Use números reais de um cliente, sem identificar a empresa.`,leg:`Raio-X de um diagnóstico real. A empresa não é identificada, os números são verdadeiros.\n\n[Resuma em 4 a 6 linhas a distância entre o que o dono acreditava e o que os números mostraram.]`,cta:'Salvar',tags:TAGS_BASE,nota:'Use dados reais. Se ainda não tiver um caso para este dia, troque pelo Caso #02 quando ele estiver pronto.'},
{d:'2026-11-07',f:'Reel',p:'prova',t:'A pergunta que eu faço em toda primeira reunião',dur:'70-80s',g:`"Toda primeira reunião de diagnóstico eu faço a mesma pergunta. E quase nenhum dono sabe responder."`,tela:`Quanto você retira da empresa por mês?`,rot:[`"Toda primeira reunião de diagnóstico eu faço a mesma pergunta. E quase nenhum dono sabe responder.`,`A pergunta é: quanto você retira da empresa por mês? E isso está documentado?`,`A resposta mais comum é 'depende'. Depende do mês, depende se sobrou.`,`Aí eu peço os extratos. E descubro que o dono tirou R$ 1.500 na segunda para a escola do filho, R$ 800 na quinta para o mercado. No fim do mês, foram R$ 9 mil. E ele jurava que não tirava quase nada.`,`O problema não é tirar R$ 9 mil. O problema é que isso não aparece como custo. A DRE mostra lucro de R$ 12 mil, mas R$ 9 mil já saíram para pagar a vida do dono. O lucro real era de R$ 3 mil.`,`Por isso o primeiro passo de qualquer organização financeira é definir um pró-labore fixo, pago no mesmo dia todo mês, e tratar isso como custo.`,`Se a sua resposta para a minha pergunta foi 'depende', a sua empresa ainda não sabe quanto custa ter você como dono."`],grav:GRAV_MEET,leg:`Quanto você retira da empresa por mês?\n\nSe a resposta é "depende", o seu custo de vida virou uma despesa variável invisível dentro da empresa.\n\nO pró-labore fixo não é para limitar o dono. É para a empresa saber quanto precisa gerar para pagar todo mundo, inclusive você.\n\nResponde aqui: você tem pró-labore definido? Sim ou não.`,cta:'Responder sim ou não',tags:TAGS_BASE+' #prolabore'},
{d:'2026-11-08',f:'Carrossel',p:'visao',t:'5 perguntas que todo dono deveria responder de cabeça',dur:'8 slides',g:`Capa: "Se você não responde estas 5 perguntas de cabeça, você está dirigindo a empresa no escuro."`,tela:`Uma pergunta por slide, com o "por que importa" logo abaixo.`,rot:[`1. Se você não responde estas 5 perguntas de cabeça, você está dirigindo a empresa no escuro.`,`2. Quanto você retira por mês, e isso está documentado?`,`3. Qual produto ou serviço tem a maior margem?`,`4. Quanto custam, por mês, as dívidas da empresa?`,`5. Você precifica por cálculo ou por intuição?`,`6. O caixa do fim do mês bate com o lucro que você acredita ter?`,`7. Essas perguntas são da minha entrevista de diagnóstico financeiro. Quem responde as cinco com segurança é minoria.`,`8. Quantas você respondeu? Comenta o número.`],grav:ARTE,leg:`Essas são cinco das perguntas que eu faço na entrevista do diagnóstico financeiro.\n\nElas parecem simples, mas cada uma revela um tipo de problema diferente.\n\nResponda com sinceridade, mesmo que só para você. E comenta quantas conseguiu responder.`,cta:'Comentar quantas respondeu',tags:TAGS_BASE+' #gestaofinanceira'},
{d:'2026-11-09',f:'Reel',p:'tese',t:'Seu vendedor não é o problema',dur:'70-85s',g:`"Você já trocou de vendedor três vezes e o resultado continua igual? Então o problema não é o vendedor."`,tela:`100 contatos → 30 propostas → 6 vendas. Onde quebra?`,rot:[`"Você já trocou de vendedor três vezes e o resultado continua igual? Então o problema não é o vendedor.`,`Quando eu faço um diagnóstico comercial, a primeira coisa que eu peço é o funil. Quantos contatos chegaram no mês, quantos viraram proposta e quantos fecharam. Na maioria das empresas, ninguém sabe.`,`Vamos supor 100 contatos, 30 propostas e 6 vendas. Se a conversão de proposta para venda está abaixo de 10%, o problema é proposta ou abordagem.`,`São problemas diferentes, com soluções diferentes. Trocar o vendedor não resolve nenhum dos dois.`,`O que eu encontro quase sempre: cada vendedor vende de um jeito, não existe roteiro, ninguém sabe quantos contatos cada um fez.`,`Nesse cenário, o vendedor bom vende por talento e o médio vende pouco. Quando o bom sai, leva o resultado junto.`,`Processo comercial existe para que a venda dependa do método, e não do talento de uma pessoa."`],grav:GRAV_SENTADO,leg:`Trocar de vendedor sem mudar o processo é trocar o motorista de um carro sem motor.\n\nAntes de demitir ou contratar alguém no comercial, responda três perguntas:\n1. Quantos contatos chegaram no último mês, e de onde vieram?\n2. Quantos viraram proposta?\n3. Quantas propostas viraram venda?\n\nA sua empresa tem um processo comercial escrito ou cada vendedor faz do seu jeito?`,cta:'Comentar',tags:TAGS_BASE+' #vendas #gestaocomercial'},
{d:'2026-11-10',f:'Carrossel',p:'metodo',t:'Os 6 números do diagnóstico comercial',dur:'9 slides',g:`Capa: "6 números que mostram por que a sua empresa não vende mais. Quantos você sabe?"`,tela:`Um número por slide: como calcular e qual é o sinal de alerta.`,rot:[`1. 6 números que mostram por que a sua empresa não vende mais.`,`2. Taxa de conversão por etapa: contato → proposta → venda. Alerta: menos de 10% das propostas virando venda.`,`3. Ciclo de vendas: tempo do primeiro contato ao fechamento. Alerta: mais de 30 dias para um produto simples.`,`4. Ticket médio e mix: qual produto mais vende vs qual tem maior margem.`,`5. Origem dos clientes: de onde vem cada um e quanto custa trazer. Alerta: mais da metade por indicação.`,`6. Processo documentado: existe roteiro, cadência de follow-up e proposta padrão?`,`7. Metas e comissão: a meta tem base no histórico? A comissão premia o comportamento certo?`,`8. Esses são os indicadores do diagnóstico comercial da Arkhen.`,`9. Salva e confere quantos você consegue calcular hoje.`],grav:ARTE,leg:`Comercial sem número é opinião.\n\nO slide 7 é o que mais surpreende os donos. Comissão calculada só sobre o faturamento faz o vendedor ganhar mais quando dá desconto.\n\nSalva e me conta: quantos desses 6 você consegue calcular hoje?`,cta:'Salvar e comentar',tags:TAGS_BASE+' #vendas'},
{d:'2026-11-11',f:'Estático',p:'tese',t:'Indicação não é estratégia comercial',dur:'1 imagem + legenda longa',g:`"Indicação não é estratégia comercial. É sorte com boa reputação."`,tela:`Frase única.`,rot:[`Arte única.`],grav:ARTE,leg:`Antes que alguém se ofenda: indicação é ótima. É o cliente mais barato e o que mais confia. O problema é depender só dela.\n\nEmpresa que cresce só por indicação vive três armadilhas: o teto, a imprevisibilidade e a dependência de quem indica.\n\nO que eu estruturo com os clientes nesse ponto não é abandonar a indicação. É transformá-la em processo.\n\nDa sua carteira atual, quantos por cento chegaram por indicação?`,cta:'Comentar',tags:TAGS_BASE+' #vendas'},
{d:'2026-11-12',f:'Reel',p:'react',t:'Reagindo: "o cliente só fecha com desconto"',dur:'70-80s',g:`"Ela tocou num ponto que eu vejo toda semana. Mas o problema começa antes."`,tela:`Cliente só fecha com desconto?`,rot:[`[Trecho de 3 a 5 segundos do vídeo de referência, com crédito.]`,`"Ela tocou num ponto que eu vejo toda semana. Mas o problema começa antes.`,`Quando o cliente só fecha com desconto, o dono culpa o mercado, a crise ou o concorrente. Mas encontro quase sempre uma de três coisas.`,`Primeira: a proposta não explica o impacto. Lista o que você faz, não o que o cliente ganha.`,`Segunda: o cliente é o errado. Se o seu marketing atrai quem decide por preço, nenhum vendedor vai conseguir vender valor.`,`Terceira: o vendedor tem autonomia para dar desconto, mas não tem argumento.`,`Desconto recorrente é sintoma. Se você tratar só o sintoma, vai continuar vendendo cada vez mais barato."`],grav:GRAV_REACT,leg:`Desconto recorrente quase nunca é problema de preço.\n\nSe a sua equipe precisa de desconto para fechar a maioria das vendas, revise três coisas:\n1. A proposta mostra o resultado ou só lista o que você faz?\n2. Os clientes valorizam o que você entrega?\n3. O vendedor sabe defender o valor?\n\nNa sua empresa, quantas vendas do mês passado saíram com desconto?`,cta:'Comentar',tags:TAGS_BASE+' #vendas',nota:'Referência: vídeo da @julianamagnobaptista salvo no seu grupo.'},
{d:'2026-11-13',f:'Carrossel',p:'prova',t:'O que meus clientes dizem depois de alguns meses',dur:'6 a 8 slides',g:`Capa: "Não sou eu que vou te convencer. São eles."`,tela:`Prints de WhatsApp com nome e foto ocultados.`,rot:[`1. Capa: "Não sou eu que vou te convencer. São eles."`,`2 a 6. Um print por slide. Acima de cada um, contexto: segmento, tempo de consultoria e o que mudou.`,`7. "O que esses clientes têm em comum: participaram, aplicaram e cobraram o próprio time."`,`8. "Quer conversar sobre a sua empresa? Me manda ESTRUTURA no direct."`],grav:`Sem gravação. Prints reais, com autorização e dados ocultados.`,leg:`Algumas mensagens que eu recebi de clientes nos últimos meses.\n\nEu faço questão de colocar o contexto de cada uma, porque resultado em gestão não aparece em 7 dias.\n\nSe você quer entender se a Arkhen faz sentido para a sua empresa, me manda ESTRUTURA no direct.`,cta:'Mandar ESTRUTURA no direct',tags:TAGS_BASE},
{d:'2026-11-14',f:'Reel',p:'prova',t:'Os documentos que eu peço antes do diagnóstico',dur:'70-80s',g:`"Antes da primeira reunião de diagnóstico, eu peço estes documentos. Metade das empresas não consegue me mandar."`,tela:`Você conseguiria mandar isso amanhã?`,rot:[`"Antes da primeira reunião de diagnóstico, eu peço estes documentos. Metade das empresas não consegue me mandar.`,`[Compartilhe a tela com a lista.] DRE dos últimos 3 a 6 meses. Extrato bancário dos últimos 3 meses. Planilha de despesas fixas e variáveis. Faturamento por período. Lista de dívidas e parcelamentos. Tabela de preços. E a folha de pagamento do mês.`,`Não é burocracia. Cada documento responde uma pergunta.`,`Quando a empresa não consegue me entregar isso, eu já tenho o primeiro achado do diagnóstico: o dono está tomando decisões sem informação.`,`E não precisa ser perfeito. Uma planilha simples, atualizada, vale mais do que um sistema caro que ninguém alimenta.`,`Faz o teste: se eu te pedisse esses documentos hoje, você conseguiria me mandar até amanhã?"`],grav:GRAV_MEET,leg:`O diagnóstico começa antes da primeira reunião: na lista de documentos.\n\nSalva esta lista e tenta montar a sua pasta esta semana. Só esse exercício já muda a forma como você enxerga a empresa.`,cta:'Salvar',tags:TAGS_BASE+' #gestaofinanceira'},
{d:'2026-11-15',f:'Carrossel',p:'visao',t:'Ninguém te avisa que ser dono é decidir sozinho',dur:'9 slides',g:`Capa: "Ninguém te avisa que ser dono de empresa é decidir sozinho."`,tela:`Fundo escuro, texto creme, tom mais reflexivo.`,rot:[`1. Ninguém te avisa que ser dono de empresa é decidir sozinho.`,`2. O funcionário leva um problema para o gerente. O gerente leva para você. Você leva para quem?`,`3. Por isso tanto dono decide no impulso, à noite, cansado, olhando o saldo do banco.`,`4. O time percebe isso antes de você. Ele lê o seu humor antes de ler o seu plano.`,`5. Estrutura não serve para tirar decisões de você. Serve para você decidir com informação, e não com ansiedade.`,`6. Na prática: números atualizados toda semana, uma reunião fixa de gestão e pessoas com autonomia definida.`,`7. Tem também um ponto que pouca gente admite: ter alguém de fora com quem pensar.`,`8. O peso de ser dono não some. Mas ele deixa de te paralisar.`,`9. Qual decisão você está adiando hoje na sua empresa?`],grav:ARTE,leg:`Uma reflexão de feriado.\n\nSer dono é bonito na foto e pesado na decisão.\n\nA estrutura não tira o peso da cadeira. Mas ela muda de onde a decisão vem: do número, e não do medo.\n\nQual decisão você está adiando hoje?`,cta:'Salvar',tags:TAGS_BASE+' #lideranca'},
{d:'2026-11-16',f:'Reel',p:'tese',t:'Contratar em empresa bagunçada multiplica o caos',dur:'70-80s',g:`"Você está pensando em contratar mais gente porque a equipe não dá conta? Espera."`,tela:`Mais gente ou mais estrutura?`,rot:[`"Você está pensando em contratar mais gente porque a equipe não dá conta? Espera. Talvez você esteja prestes a dobrar o problema.`,`A sensação de que falta gente quase sempre vem de três coisas: retrabalho, tarefa sem dono e tudo esperando a sua aprovação.`,`Se a equipe refaz trabalho porque ninguém sabe o jeito certo, contratar mais uma pessoa significa mais uma pessoa aprendendo o jeito errado.`,`Enquanto isso, ela custa bem mais do que o salário, com encargos e benefícios. E leva meses para render.`,`Antes de abrir a vaga: meça quantas horas vão para retrabalho, escreva a função com o que é sucesso nela e defina quem acompanha essa pessoa.`,`Processo primeiro. Pessoa depois."`],grav:GRAV_SENTADO,leg:`Contratação sem estrutura vira custo fixo com ansiedade.\n\nAntes da próxima contratação, responda:\n1. Quanto tempo a equipe gasta refazendo coisas?\n2. Cada tarefa tem um responsável claro?\n3. Existe um passo a passo para a função que você vai contratar?\n4. Quem vai treinar e cobrar essa pessoa nos primeiros 90 dias?\n\nSe algum desses estiver em branco, a vaga ainda não está pronta para ser aberta.`,cta:'Compartilhar com o sócio',tags:TAGS_BASE+' #gestaodepessoas'},
{d:'2026-11-17',f:'Carrossel',p:'metodo',t:'Precificação: a conta do preço mínimo',dur:'10 slides',g:`Capa: "Você cobra R$ 250 num serviço que, pelas suas próprias contas, deveria custar R$ 399."`,tela:`Conta montada passo a passo, como numa planilha. Resultado final em laranja.`,rot:[`1. Você cobra R$ 250 num serviço que, pelas suas próprias contas, deveria custar R$ 399.`,`2. A maioria das empresas precifica de três jeitos errados: copiando o concorrente, aplicando markup sobre a matéria-prima ou cobrando o que acha que o cliente aceita.`,`3. O jeito certo começa pelos custos fixos. Exemplo: R$ 12.000 por mês.`,`4. Depois, as horas que você de fato vende — não as trabalhadas, as produtivas. 160 horas vendáveis: custo de R$ 75/hora.`,`5. Um serviço de 3 horas carrega R$ 225 de custo fixo. Somando R$ 50 de material = R$ 275.`,`6. Agora entram os percentuais sobre o preço: 6% de imposto e 25% de margem. Juntos, 31%.`,`7. Preço = custo ÷ (1 − 0,31) = R$ 275 ÷ 0,69 = R$ 399.`,`8. Por que dividir, e não multiplicar? Porque imposto e margem são calculados sobre o preço de venda, não sobre o custo.`,`9. Se o mercado não paga R$ 399, a solução não é cobrar R$ 250 e torcer. É reduzir as horas do serviço, os custos ou mudar o público.`,`10. Salva e refaz a conta com os seus números.`],grav:ARTE,leg:`Precificação é onde mais empresa perde dinheiro sem perceber.\n\nO erro do slide 8 é muito comum: o dono soma imposto e margem e multiplica sobre o custo. Resultado: ele acha que está ganhando 25% e ganha bem menos.\n\nRefaz a conta com os seus números e me conta: o seu preço atual está acima ou abaixo do mínimo?`,cta:'Salvar e comentar',tags:TAGS_BASE+' #precificacao'},
{d:'2026-11-18',f:'Estático',p:'tese',t:'Margem abaixo de 10%',dur:'1 imagem + legenda longa',g:`"Margem líquida abaixo de 10% não é empresa. É um emprego com risco."`,tela:`Frase única, "emprego com risco" em laranja.`,rot:[`Arte única.`],grav:ARTE,leg:`No diagnóstico financeiro da Arkhen, margem líquida abaixo de 10% é tratada como problema crítico.\n\nCom margem baixa, qualquer imprevisto normal empurra a empresa para o vermelho. O dono trabalha como se fosse dono e ganha como se fosse funcionário.\n\nMargem saudável não é ganância. É a gordura que permite à empresa atravessar um ano ruim.\n\nVocê sabe qual é a margem líquida da sua empresa?`,cta:'Comentar',tags:TAGS_BASE+' #gestaofinanceira'},
{d:'2026-11-19',f:'Reel',p:'react',t:'Reagindo: grito de guerra na empresa',dur:'70-80s',g:`"Grito de guerra não cria cultura. E eu posso provar."`,tela:`O que é cultura de verdade?`,rot:[`[Trecho de 3 a 5 segundos da sátira salva no seu grupo de ideias, com crédito.]`,`"Grito de guerra não cria cultura. E eu posso provar.`,`Pensa numa empresa que tem 'comprometimento' escrito na parede. Mas o vendedor que bate meta e o que não bate ganham a mesma coisa. E quem chega atrasado todo dia nunca teve uma conversa.`,`Qual é a cultura dessa empresa? Não é comprometimento. É que tanto faz.`,`Cultura é o comportamento que se repete porque ninguém corrige. Ela não é o que você fala. É o que você tolera.`,`Quando eu faço o diagnóstico de pessoas, eu comparo os valores declarados com os valores praticados. A distância entre os dois explica quase todo problema de clima.`,`Quer mudar a cultura? Comece pelo que você aceita."`],grav:GRAV_REACT,leg:`Cultura não é o que está escrito na parede. É o que acontece quando ninguém está olhando.\n\nSe você quer saber qual é a cultura real da sua empresa, olhe para:\n1. O que acontece com quem entrega muito acima do esperado?\n2. O que acontece com quem entrega abaixo, mês após mês?\n3. Quais regras existem no papel e ninguém cumpre?\n\nO que a sua empresa tolera hoje que não deveria?`,cta:'Comentar',tags:TAGS_BASE+' #culturaorganizacional'},
{d:'2026-11-20',f:'Carrossel',p:'prova',t:'Caso: a empresa que dependia 100% do dono',dur:'9 slides',g:`Capa: "Todas as decisões passavam pelo dono. Contamos: eram [X] por dia."`,tela:`Formato de relatório: "CASO ARKHEN • EMPRESA NÃO IDENTIFICADA".`,rot:[`1. Capa com o número de decisões por dia que passavam pelo dono.`,`2. A empresa: [segmento, porte, tamanho do time].`,`3. Como era a rotina do dono: [horário, o que ele fazia, quantas interrupções].`,`4. O que a gente mapeou: processos que só existiam na cabeça dele, aprovações desnecessárias.`,`5. O custo disso: horas do dono por semana, vendas que travaram, retrabalho.`,`6. O que estruturamos: procedimentos escritos, limites de decisão para cada função.`,`7. A parte difícil: a resistência do próprio dono em soltar.`,`8. Resultado: horas liberadas por semana.`,`9. "Sua empresa funciona sem você por 15 dias? Se a resposta é não, a gente começa por aí."`],grav:`Sem gravação. Dados reais de um cliente, anonimizados.`,leg:`Caso real, empresa não identificada.\n\n[Resuma em 4 a 6 linhas: a rotina do dono, o que foi mapeado e o que mudou.]\n\nO maior limitante de crescimento dessa empresa era o próprio dono. Não por falta de capacidade, mas por excesso de presença.`,cta:'Salvar',tags:TAGS_BASE+' #processos',nota:'Use dados reais. Se não tiver um caso assim, troque por "Prints de clientes #2".'},
{d:'2026-11-21',f:'Reel',p:'prova',t:'O custo do retrabalho: a conta que ninguém faz',dur:'70-80s',g:`"Tem um custo na sua empresa que não aparece em nenhum relatório. E ele pode passar de R$ 40 mil por ano."`,tela:`5 pessoas × 5h × R$ 35 × 4,3 semanas = R$ 3.762 por mês`,rot:[`"Tem um custo na sua empresa que não aparece em nenhum relatório.`,`É o retrabalho. Pedido refeito porque saiu errado. Orçamento corrigido três vezes. Ninguém lança isso no financeiro.`,`[Conta na tela.] 5 pessoas na equipe. Cada uma perde 5 horas por semana. A hora custa R$ 35 com encargos. Vezes 4,3 semanas: R$ 3.762 por mês. Mais de R$ 45 mil por ano. Pagando gente para fazer a mesma coisa duas vezes.`,`E sem contar o cliente que foi embora irritado, que é o custo mais caro.`,`Retrabalho quase sempre tem a mesma origem: processo que não está escrito, informação que se perde entre uma pessoa e outra.`,`Faz a conta da sua empresa. O número costuma assustar."`],grav:GRAV_MEET,leg:`O retrabalho é o custo que não aparece na DRE.\n\nA conta: horas refeitas por semana × custo da hora × 4,3 semanas × número de pessoas.\n\nO primeiro passo para reduzir não é cobrar mais atenção da equipe. É descobrir onde o erro nasce.\n\nSalva e faz a conta com a sua equipe esta semana.`,cta:'Salvar',tags:TAGS_BASE+' #processos'},
{d:'2026-11-22',f:'Carrossel',p:'convite',t:'Para quem é (e para quem não é) a Arkhen',dur:'9 slides',g:`Capa: "Eu não atendo qualquer empresa. E isso é bom para você."`,tela:`Verde para "é para você", laranja para "não é para você".`,rot:[`1. Eu não atendo qualquer empresa. E isso é bom para você.`,`2. Consultoria não é mágica. Ela só funciona em um tipo específico de empresa.`,`3. É para você se a sua empresa fatura entre R$ 20 mil e R$ 200 mil por mês, tem pelo menos 1 ano e um time formado.`,`4. É para você se você trabalha muito, sente que não vê o resultado do esforço e está travado no operacional.`,`5. É para você se você está disposto a participar, aprender e mudar o próprio jeito de gerir.`,`6. Não é para você se você quer uma planilha pronta para entregar a alguém e sumir.`,`7. Não é para você se a empresa ainda fatura muito pouco. Abaixo de R$ 20 mil por mês, o problema costuma ser volume, não gestão.`,`8. Não é para você se a empresa está em crise aguda, à beira de fechar.`,`9. Se você se reconheceu nos slides 3, 4 e 5, me manda ESTRUTURA no direct.`],grav:ARTE,leg:`Eu poderia dizer que ajudo qualquer empresa. Seria mentira.\n\nConsultoria funciona quando três coisas se encontram: uma empresa com estrutura mínima, um problema de gestão e um dono disposto a participar.\n\nSe você se viu na descrição, me manda ESTRUTURA no direct.`,cta:'Mandar ESTRUTURA no direct',tags:TAGS_BASE},
{d:'2026-11-23',f:'Reel',p:'tese',t:'Seu maior cliente pode ser seu maior risco',dur:'65-75s',g:`"O seu melhor cliente pode ser o maior risco da sua empresa. Deixa eu te mostrar a conta."`,tela:`1 cliente = 40% da receita. E se ele for embora?`,rot:[`"O seu melhor cliente pode ser o maior risco da sua empresa.`,`Uma empresa fatura R$ 100 mil por mês e lucra R$ 10 mil. Um único cliente responde por 40% desse faturamento: R$ 40 mil. A margem de contribuição desse cliente é de 35%: ele deixa R$ 14 mil por mês.`,`Se ele for embora, a empresa perde esses R$ 14 mil. Os custos fixos continuam. O lucro de R$ 10 mil vira um prejuízo de R$ 4 mil. Do dia para a noite.`,`E tem um efeito silencioso: esse cliente sabe do peso dele. Então ele dita o preço, o prazo de pagamento e a sua agenda.`,`No diagnóstico financeiro, qualquer cliente acima de 30% do faturamento é marcado como risco.`,`Diversificar a carteira não é falta de gratidão. É gestão de risco."`],grav:GRAV_SENTADO,leg:`Concentração de receita é um dos riscos que eu checo em todo diagnóstico financeiro.\n\nFaça o teste: liste os seus 5 maiores clientes e calcule quanto cada um representa do faturamento. Se algum passa de 30%, a empresa tem um ponto único de falha.\n\nQuanto da sua receita vem do seu maior cliente?`,cta:'Comentar',tags:TAGS_BASE+' #gestaofinanceira'},
{d:'2026-11-24',f:'Carrossel',p:'metodo',t:'A Pirâmide da Maturidade Empresarial',dur:'9 slides',g:`Capa: "A sua empresa está tentando construir o telhado sem fundação."`,tela:`Slide 2 com a pirâmide de 5 níveis nas cores da Arkhen.`,rot:[`1. A sua empresa está tentando construir o telhado sem fundação.`,`2. É assim que eu enxergo qualquer empresa: uma pirâmide de cinco níveis. Cada um só se sustenta se o de baixo estiver firme.`,`3. Base: financeiro e caixa. Quem pula esta etapa: cresce e não sabe por que falta dinheiro.`,`4. Comercial e mercado: gerar demanda e converter com previsibilidade.`,`5. Processos e operações: entregar com qualidade sem depender do dono.`,`6. Estratégia e crescimento: decidir para onde ir, com metas e indicadores.`,`7. Topo: governança e cultura. Quem tenta começar por aqui: faz missão, visão e valores para uma empresa que não sabe a própria margem.`,`8. O erro mais comum é começar pelo topo, porque é o mais bonito.`,`9. Em qual nível a sua empresa está travada? Salva e comenta.`],grav:ARTE,leg:`Toda empresa tem uma ordem de construção. Pular etapas sai caro.\n\nÉ por isso que a Arkhen começa, na maioria dos casos, pelo financeiro. Não porque seja o mais interessante, mas porque é o que dá estabilidade para todo o resto.\n\nEm qual nível a sua empresa está travada hoje?`,cta:'Salvar e comentar',tags:TAGS_BASE},
{d:'2026-11-25',f:'Estático',p:'tese',t:'Empresa que depende de herói',dur:'1 imagem + legenda longa',g:`"Empresa que depende de herói não tem processo. Tem refém."`,tela:`Frase única.`,rot:[`Arte única.`],grav:ARTE,leg:`Toda empresa tem um herói. O funcionário que resolve tudo, que sabe onde está cada coisa, que fica até mais tarde no fechamento.\n\nO dono adora esse funcionário. E deveria se preocupar com ele.\n\nProteger a empresa disso não é desvalorizar o herói. É pedir que ele ajude a documentar o que sabe, treine uma segunda pessoa e transforme talento individual em processo da empresa.\n\nQuem é o herói da sua empresa? E o que acontece se ele sair amanhã?`,cta:'Comentar',tags:TAGS_BASE+' #processos'},
{d:'2026-11-26',f:'Reel',p:'react',t:'Reagindo: é preciso insistir para o cliente comprar?',dur:'70-80s',g:`"Insistir é diferente de ter processo. E essa diferença vale muito dinheiro."`,tela:`Insistência ou follow-up?`,rot:[`[Trecho de 3 a 5 segundos da esquete salva no seu grupo de ideias, com crédito.]`,`"Insistir é diferente de ter processo.`,`Insistência é mandar 'e aí, conseguiu ver a proposta?' cinco vezes.`,`Follow-up com processo tem três regras. Tem data definida antes da proposta ser enviada. Tem um motivo para cada contato. E cada contato traz uma informação nova.`,`A maioria das vendas não fecha no primeiro contato. Mas a maioria dos vendedores desiste depois do primeiro ou do segundo.`,`Então não, você não precisa insistir. Você precisa de um processo que lembre do cliente por você."`],grav:GRAV_REACT,leg:`Follow-up não é insistência. É método.\n\nUma cadência simples:\n• Dia 1: confirma que a proposta chegou.\n• Dia 3: envia um caso de um cliente parecido.\n• Dia 7: pergunta diretamente o que falta para a decisão.\n• Dia 14: traz uma condição ou alternativa nova.\n• Dia 30: mensagem de encerramento, educada.\n\nA sua equipe tem uma cadência definida depois de enviar a proposta?`,cta:'Salvar',tags:TAGS_BASE+' #vendas'},
{d:'2026-11-27',f:'Estático',p:'tese',t:'Black Friday: amanhã a conta chega',dur:'1 imagem + legenda longa',g:`"Hoje todo mundo vai olhar o faturamento. Amanhã a conta chega."`,tela:`Frase única.`,rot:[`Arte única.`],grav:ARTE,leg:`Hoje é Black Friday. E amanhã muito dono vai postar o recorde de vendas.\n\nNa segunda-feira, eu sugiro olhar quatro números antes de comemorar:\n1. Margem por pedido.\n2. Quanto foi parcelado.\n3. Custo para trazer cada cliente.\n4. Quem comprou.\n\nFaturamento alto com margem baixa e caixa travado não é vitória. É um problema adiado para janeiro.\n\nSe você quer entrar em 2027 sabendo onde está o lucro, me manda ESTRUTURA no direct.`,cta:'Mandar ESTRUTURA no direct',tags:TAGS_BASE+' #blackfriday'},
{d:'2026-11-28',f:'Reel',p:'metodo',t:'A rotina financeira mínima: dia, semana e mês',dur:'75-85s',g:`"Se você fizer só isto no financeiro da sua empresa, já vai estar à frente da maioria."`,tela:`Todo dia • Toda semana • Todo mês`,rot:[`"Se você fizer só isto no financeiro da sua empresa, já vai estar à frente da maioria.`,`Todo dia: registrar tudo o que entrou e saiu e conferir se o saldo bate com o do banco. Dez minutos.`,`Toda semana: olhar as contas a pagar e a receber dos próximos 15 dias.`,`Todo mês: fechar a DRE gerencial. Quanto vendeu, quanto custou, quanto sobrou.`,`Não precisa de sistema caro. Precisa de duas coisas: disciplina e um responsável.`,`E se o responsável for você, bloqueie esse horário na agenda como se fosse uma reunião com cliente."`],grav:`Sentado, compartilhando na tela um quadro simples com as três rotinas.`,leg:`A rotina financeira mínima de uma empresa organizada:\n\nTodo dia: lançar entradas e saídas e conciliar com o banco.\nToda semana: contas a pagar e a receber dos próximos 15 dias.\nTodo mês: DRE gerencial, margem e comparação com a meta.\n\nSalva e defina hoje quem é o responsável por cada uma.`,cta:'Salvar',tags:TAGS_BASE+' #gestaofinanceira'},
{d:'2026-11-29',f:'Carrossel',p:'visao',t:'5 padrões que se repetiram nas empresas em 2026',dur:'8 slides',g:`Capa: "Este ano eu entrei em empresas de vários segmentos. Os mesmos 5 problemas se repetiram."`,tela:`Um padrão por slide.`,rot:[`1. Este ano eu entrei em empresas de vários segmentos. Os mesmos 5 problemas se repetiram.`,`2. O dono não sabia quanto retirava.`,`3. O preço foi definido por comparação, não por cálculo.`,`4. O comercial não tinha funil.`,`5. O processo estava na cabeça de uma ou duas pessoas.`,`6. Tudo passava pelo dono.`,`7. O que esses padrões têm em comum: nenhum deles é falta de esforço. São falta de estrutura. E todos têm solução.`,`8. Qual deles existe na sua empresa hoje?`],grav:ARTE,leg:`Um ano dentro de empresas de segmentos diferentes. Os problemas mudam de roupa, mas são os mesmos.\n\n[Acrescente aqui 2 ou 3 linhas suas, com uma observação pessoal sobre o que mais te marcou em 2026.]\n\nQual desses você reconhece na sua empresa?`,cta:'Comentar',tags:TAGS_BASE,nota:'Os 5 padrões vieram do seu manual. Confirme se eles batem com o que você realmente viu em 2026.'},
{d:'2026-11-30',f:'Reel',p:'tese',t:'Dezembro decide o seu janeiro',dur:'65-75s',g:`"Hoje vence a primeira parcela do 13º. E o que você fizer em dezembro vai decidir como a sua empresa passa janeiro."`,tela:`O caixa de janeiro se constrói em dezembro`,rot:[`"Hoje vence a primeira parcela do 13º. E o que você fizer em dezembro vai decidir como a sua empresa passa janeiro.`,`Janeiro é um mês traiçoeiro. Em muitos segmentos, as vendas caem. Ao mesmo tempo, chegam os impostos de começo de ano.`,`E dezembro dá uma falsa sensação de folga, porque o movimento costuma ser maior.`,`Três coisas para fazer agora: Primeiro, separe o dinheiro da segunda parcela do 13º. Segundo, projete o caixa de janeiro com uma venda menor que a de dezembro. Terceiro, tudo o que entrar acima dessa projeção vai para uma reserva.`,`Amanhã começa aqui a série Planejamento 2027. Ativa as notificações."`],grav:GRAV_SENTADO,leg:`O caixa de janeiro se constrói em dezembro.\n\nFaça a projeção hoje: quanto você espera vender em janeiro, sendo conservador, e quanto vai precisar pagar.\n\nAmanhã começa a série Planejamento 2027.`,cta:'Ativar notificações',tags:TAGS_BASE+' #planejamento'},
];

try { const u = JSON.parse(localStorage.getItem('ark_mkt_ui')||'null'); if (u) Object.assign(mktUi, u); } catch {}

const dObj = s => new Date(s+'T12:00');
function fmtDate(s){ const d = dObj(s); return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'}); }

const MKT_ALL = [
  ...MKT_POSTS.map(p => ({...p, det:true})),
  ...MKT_PAUTAS_DEZ.map(([d,f,p,t,g]) => ({d,f,p,t,g,det:false})),
].sort((a,b)=>a.d.localeCompare(b.d));

function mktStatusOf(p){ return mktStatus[p.d] || (p.det ? 'roteiro' : 'pauta'); }
function mktSetStatus(d, s){ mktStatus[d] = s; try { localStorage.setItem(MKT_ST_KEY, JSON.stringify(mktStatus)); } catch {} }
function stBadge(s){ return `<span class="st st-${s}">${MKT_ST[s]}</span>`; }
function pilarPill(k){ const p = MKT_PILARES[k]; return `<span class="mkt-pill"><i class="mkt-dot" style="background:${p.cor}"></i>${p.nome}</span>`; }

function mktCopy(id, btn){
  const el = document.getElementById(id); const txt = el.innerText;
  const b = btn || document.querySelector(`[onclick*="${id}"]`);
  const done = () => { if (b) { const o = b.textContent; b.textContent = 'Copiado'; setTimeout(()=>b.textContent=o,1500); } };
  try { navigator.clipboard.writeText(txt).then(done).catch(()=>{ selectText(el); toast('Texto selecionado. Use Ctrl+C para copiar.'); }); }
  catch { selectText(el); toast('Texto selecionado. Use Ctrl+C para copiar.'); }
}
function selectText(el){ const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }

function renderMktCal(){
  const meses = [...new Set(MKT_ALL.map(p=>p.d.slice(0,7)))];

    const n = dObj(m+'-01').toLocaleDateString('pt-BR',{month:'short'}).replace('.','');
    return `<button class="${m===mktUi.mes?'on':''}" onclick="mktSetMes('${m}')">${n.charAt(0).toUpperCase()+n.slice(1)} ${m.slice(2,4)}</button>`;
  }).join('');
  document.querySelectorAll('#mkt-view-seg button').forEach(b=>b.classList.toggle('on', b.dataset.v===mktUi.view));

  const sel = document.getElementById('mkt-filtro-pilar');
  if (!sel.options.length) sel.innerHTML = '<option value="">Todos os pilares</option>' + Object.entries(MKT_PILARES).map(([k,p])=>`<option value="${k}">${p.nome}</option>`).join('');
  const fp = sel.value;

  const doMes = MKT_ALL.filter(p=>p.d.startsWith(mktUi.mes));
  const posts = doMes.filter(p=>!fp || p.p===fp);
  const cont = s => doMes.filter(p=>mktStatusOf(p)===s).length;
  const _h = new Date(); const hojeStr = `${_h.getFullYear()}-${String(_h.getMonth()+1).padStart(2,'0')}-${String(_h.getDate()).padStart(2,'0')}`;
  const prox = MKT_ALL.find(p=>p.d>=hojeStr && mktStatusOf(p)!=='postado');
  document.getElementById('mkt-cal-kpis').innerHTML = `
    <div class="mkt-kpi-tile"><div class="mkt-kpi-label">Posts no mês</div><div class="mkt-kpi-value">${doMes.length}</div><div class="mkt-kpi-delta">${doMes.filter(p=>p.f==='Reel').length} Reels • ${doMes.filter(p=>p.f!=='Reel').length} artes</div></div>
    <div class="mkt-kpi-tile"><div class="mkt-kpi-label">Falta gravar</div><div class="mkt-kpi-value">${doMes.filter(p=>p.f==='Reel' && ['pauta','roteiro'].includes(mktStatusOf(p))).length}</div><div class="mkt-kpi-delta">Reels com roteiro pronto</div></div>
    <div class="mkt-kpi-tile"><div class="mkt-kpi-label">Postados</div><div class="mkt-kpi-value">${cont('postado')}</div><div class="mkt-kpi-delta">de ${doMes.length} no mês</div></div>
    <div class="mkt-kpi-tile"><div class="mkt-kpi-label">Próximo post</div><div class="mkt-kpi-value" style="font-size:16px;line-height:1.3">${prox?fmtDate(prox.d).slice(0,5)+' • '+prox.f:'—'}</div><div class="mkt-kpi-delta">${prox?esc(prox.t):''}</div></div>`;

  const body = document.getElementById('mkt-cal-body');
  if (mktUi.view === 'mes') body.innerHTML = mktGrid(posts, hojeStr);
  else if (mktUi.view === 'lista') body.innerHTML = `<div class="card">${posts.map(p=>`
      <div class="list-row" onclick="openPost('${p.d}')" tabindex="0">
        <div class="list-date">${fmtDate(p.d).slice(0,5)}<small>${dObj(p.d).toLocaleDateString('pt-BR',{weekday:'long'})}</small></div>
        <div class="list-main"><b>${esc(p.t)}</b><span>${p.f} • ${MKT_PILARES[p.p].nome} • ${esc(p.g)}</span></div>
        <div>${stBadge(mktStatusOf(p))}</div>
      </div>`).join('') || '<div class="empty-state">Nenhum post com esse filtro.</div>'}</div>`;
  else body.innerHTML = mktGravar(posts);

  document.getElementById('mkt-cal-foot').textContent = mktUi.mes==='2026-12'
    ? 'Dezembro está em pauta (título, formato e gancho). O roteiro completo de cada post sai no fim de novembro, ajustado com os números do mês.'
    : 'Clique em um post para ver roteiro, o que gravar, legenda e hashtags. O status fica salvo neste navegador.';
}

function mktGrid(posts, hojeStr){
  const [y,m] = mktUi.mes.split('-').map(Number);
  const first = new Date(y, m-1, 1), last = new Date(y, m, 0);
  const start = (first.getDay()+6)%7;
  const cells = [];
  for (let i=0;i<start;i++) cells.push('<div class="cal-day out"></div>');
  for (let d=1; d<=last.getDate(); d++){
    const ds = `${mktUi.mes}-${String(d).padStart(2,'0')}`;
    const feriado = {'2026-11-02':'Finados','2026-11-15':'Feriado','2026-11-20':'Feriado','2026-11-27':'Black Friday','2026-12-25':'Natal','2026-12-31':'Réveillon','2026-12-24':'Véspera'}[ds]||'';
    const ps = posts.filter(p=>p.d===ds);
    cells.push(`<div class="cal-day ${ds===hojeStr?'today':''}"><div class="cal-num"><span>${d}</span>${feriado?`<em>${feriado}</em>`:''}</div>
      ${ps.map(p=>{ const s = mktStatusOf(p); return `<button class="cal-chip ${s==='postado'?'done':''}" style="border-left-color:${MKT_PILARES[p.p].cor}" onclick="openPost('${p.d}')">
        <span class="ct">${esc(p.t)}</span><span class="cm"><span>${p.f}</span>${stBadge(s)}</span></button>`; }).join('')}</div>`);
  }
  while (cells.length % 7) cells.push('<div class="cal-day out"></div>');
  const head = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
  return `<div class="cal-wrap"><div class="cal-grid">${head}${cells.join('')}</div></div>`;
}

function mktWeekKey(ds){ const d = dObj(ds); const off = (d.getDay()+6)%7; d.setDate(d.getDate()-off); return d.toISOString().slice(0,10); }

function mktGravar(posts){
  const semanas = {};
  posts.forEach(p=>{ (semanas[mktWeekKey(p.d)] ||= []).push(p); });
  const blocos = Object.entries(semanas).sort().map(([seg, ps])=>{
    const fim = dObj(seg); fim.setDate(fim.getDate()+6);
    const ymdL = x => x.toISOString().slice(0,10);
    const gravar = ps.filter(p=>p.f==='Reel');
    const canva = ps.filter(p=>p.f!=='Reel');
    const item = p => { const s = mktStatusOf(p); const ok = ['gravado','editado','postado'].includes(s);
      return `<div class="grav-item"><input type="checkbox" id="g-${p.d}" ${ok?'checked':''} onchange="mktToggleGrav('${p.d}',this.checked)" aria-label="Marcar como ${p.f==='Reel'?'gravado':'pronto'}">
        <label for="g-${p.d}" style="cursor:pointer"><b>${fmtDate(p.d).slice(0,5)} • ${esc(p.t)}</b> ${stBadge(s)}
        <p>${esc(p.grav || ('Gancho: '+p.g))}</p></label></div>`; };
    return `<div class="card grav-week">
      <div class="section-head" style="margin:0"><div class="mkt-h" style="margin:0">Semana de ${fmtDate(seg).slice(0,5)} a ${fmtDate(fim.toISOString().slice(0,10)).slice(0,5)}</div></div>
      ${gravar.length?`<div class="mkt-sub" style="color:var(--accent)">Gravar sentado (${gravar.length} Reels)</div>${gravar.map(item).join('')}`:''}
      ${canva.length?`<div class="mkt-sub" style="margin-top:6px">Artes para montar no Canva (${canva.length})</div>${canva.map(item).join('')}`:''}
    </div>`;
  });
  return `<div style="display:flex;flex-direction:column;gap:14px">${blocos.join('') || '<div class="empty-state">Nada para gravar com esse filtro.</div>'}</div>`;
}

function mktToggleGrav(d, on){
  const p = MKT_ALL.find(x=>x.d===d);
  mktSetStatus(d, on ? 'gravado' : (p.det?'roteiro':'pauta'));
  renderMktCal();
}

function openPost(d){
  const p = MKT_ALL.find(x=>x.d===d); if (!p) return;
  const s = mktStatusOf(p);
  const wd = dObj(d).toLocaleDateString('pt-BR',{weekday:'long', day:'2-digit', month:'long'});
  document.getElementById('post-title').textContent = p.t;
  const sec = (lbl, html) => `<div class="det-sec"><div class="form-label">${lbl}</div>${html}</div>`;
  let html = `<div class="det-meta"><span class="mkt-pill" style="text-transform:capitalize">${wd}</span><span class="mkt-pill">${p.f}${p.dur?' • '+p.dur:''}</span>${pilarPill(p.p)}</div>`;
  html += sec('Status', `<select class="form-select" id="post-status" onchange="mktSetStatus('${d}',this.value);renderMktCal()">${Object.entries(MKT_ST).map(([k,v])=>`<option value="${k}" ${k===s?'selected':''}>${v}</option>`).join('')}</select>`);
  html += sec('Gancho (primeiros 2 segundos)', `<div class="mkt-quote">${esc(p.g)}</div>`);
  if (p.det){
    if (p.nota) html += `<div class="det-note">${esc(p.nota)}</div>`;
    html += sec('Texto na tela / capa', `<div style="font-size:13px">${esc(p.tela)}</div>`);
    const rotLbl = p.f==='Reel' ? 'Fala completa (roteiro)' : p.f==='Carrossel' ? 'Texto dos slides' : 'Arte';
    html += sec(rotLbl, `<div class="det-steps">${p.rot.map(r=>`<p>${esc(r)}</p>`).join('')}</div>`);
    html += sec('O que gravar', `<div style="font-size:13px;line-height:1.5">${esc(p.grav)}</div>`);
    html += sec('Legenda', `<div class="mkt-quote" id="post-leg">${esc(p.leg)}\n\n${esc(p.tags)}</div><div><button class="btn btn-ghost btn-sm" onclick="mktCopy('post-leg',this)">Copiar legenda com hashtags</button></div>`);
    html += sec('Chamada para ação', `<div style="font-size:13px">${esc(p.cta)}</div>`);
  } else {
    html += `<div class="det-note">Pauta de dezembro. O roteiro completo, a legenda e as hashtags saem no fim de novembro, ajustados pelo que funcionou no mês.</div>`;
  }
  document.getElementById('post-body').innerHTML = html;
  const i = MKT_ALL.indexOf(p);
  document.getElementById('post-footer').innerHTML = `
    <button class="btn btn-ghost btn-sm" ${i<=0?'disabled':''} onclick="openPost('${MKT_ALL[i-1]?.d}')">← Anterior</button>
    <button class="btn btn-ghost btn-sm" ${i>=MKT_ALL.length-1?'disabled':''} onclick="openPost('${MKT_ALL[i+1]?.d}')">Próximo →</button>
    <button class="btn btn-primary btn-sm" onclick="closeModal('post')">Fechar</button>`;
  document.getElementById('modal-post').hidden = false;
}

document.addEventListener('keydown', e => { if (e.key==='Escape' && !document.getElementById('modal-post').hidden) closeModal('post'); });
function pageComingSoon(id) { return comingSoonPage(id); }

function comingSoonPage(name) {
  return `<div class="page active"><div class="empty-state" style="padding-top:80px">
    <div class="icon">🚧</div>
    <h3>${esc(name)}</h3>
    <p>Esta seção está em desenvolvimento.</p>
  </div></div>`;
}

/* ── UTILS ──────────────────────────────────────────────── */
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toast(msg, dur = 2800) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}

/* ── INIT ────────────────────────────────────────────────── */
function init() {
  // date in topbar
  const d = new Date();
  document.getElementById('topDate').textContent =
    d.toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' });

  buildNav();
  loadLeads(); loadFin(); loadRH();
  renderPage('home');
}

init();
</script>
