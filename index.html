<title>Arkhen Gestão</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
/* ============================================================
   DESIGN TOKENS — Paleta Arkhen original (light-first)
   Layout: sidebar esquerda fixa + conteúdo principal expansível
   ============================================================ */
:root {
  /* Brand */
  --brand:       #1A4731;
  --brand-mid:   #2C5F2D;
  --brand-light: #97BC62;
  --accent:      #E07B39;
  --accent-soft: #E07B3920;
  /* Surfaces */
  --bg:          #F5F4F0;
  --bg2:         #ECEAE4;
  --surface:     #FFFFFF;
  --card:        #FFFFFF;
  --card2:       #F5F4F0;
  --sidebar-bg:  #132D20;
  --sidebar-fg:  #C8D8C4;
  --sidebar-act: #FFFFFF;
  /* Borders */
  --border:      #E0DED8;
  --border2:     #D0CEC8;
  /* Text */
  --fg:          #1C1C1A;
  --fg2:         #5A5A55;
  --fg3:         #9A9A94;
  /* Semantic */
  --green:       #2C8A4A;
  --green-bg:    #E3F4E9;
  --yellow:      #B07A00;
  --yel-bg:      #FFF3CD;
  --red:         #C0392B;
  --red-bg:      #FDEDEC;
  --blue:        #1A5A8C;
  --blue-bg:     #E3EEF8;
  --purple:      #6B46C1;
  --teal:        #0D9488;
  --orange:      #E07B39;
  /* Typography */
  --font-head: 'Inter', system-ui, sans-serif;
  --font-body: 'DM Sans', system-ui, sans-serif;
  --radius:    10px;
  --radius-sm: 6px;
  --shadow:    0 1px 4px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06);
  --shadow-sm: 0 1px 3px rgba(0,0,0,.08);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --brand:       #2C6B45;
    --brand-mid:   #3D8050;
    --brand-light: #7DAA4A;
    --accent:      #E8924E;
    --accent-soft: #E8924E22;
    --bg:          #141614;
    --bg2:         #1E211E;
    --surface:     #242824;
    --card:        #242824;
    --card2:       #1E211E;
    --sidebar-bg:  #0D1610;
    --sidebar-fg:  #8FAE8A;
    --sidebar-act: #E0F0D8;
    --border:      #2E372E;
    --border2:     #3A453A;
    --fg:          #E8EDE6;
    --fg2:         #9EB09A;
    --fg3:         #5E725A;
    --green:       #4AB06A;
    --green-bg:    #1A3524;
    --yellow:      #D9A020;
    --yel-bg:      #2E2510;
    --red:         #E05548;
    --red-bg:      #301414;
    --blue:        #4A8EC8;
    --blue-bg:     #10243A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --brand:       #2C6B45;
  --brand-mid:   #3D8050;
  --brand-light: #7DAA4A;
  --accent:      #E8924E;
  --accent-soft: #E8924E22;
  --bg:          #141614;
  --bg2:         #1E211E;
  --surface:     #242824;
  --card:        #242824;
  --card2:       #1E211E;
  --sidebar-bg:  #0D1610;
  --sidebar-fg:  #8FAE8A;
  --sidebar-act: #E0F0D8;
  --border:      #2E372E;
  --border2:     #3A453A;
  --fg:          #E8EDE6;
  --fg2:         #9EB09A;
  --fg3:         #5E725A;
  --green:       #4AB06A;
  --green-bg:    #1A3524;
  --yellow:      #D9A020;
  --yel-bg:      #2E2510;
  --red:         #E05548;
  --red-bg:      #301414;
  --blue:        #4A8EC8;
  --blue-bg:     #10243A;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 14px;
  display: flex;
  flex-direction: column;
  padding-left: max(0px, env(safe-area-inset-left, 0px));
  padding-right: max(0px, env(safe-area-inset-right, 0px));
}

/* ── TOP BAR ─────────────────────────────────────────── */
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 100;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 20px;
  height: 52px;
  flex-shrink: 0;
  box-shadow: var(--shadow-sm);
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 15px;
  font-family: var(--font-head);
  letter-spacing: .3px;
  color: var(--fg);
}
.logo-mark {
  width: 30px; height: 30px;
  background: var(--accent);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 800; color: #fff;
}
.logo-sub {
  font-size: 10px; font-weight: 400; color: var(--fg3);
  letter-spacing: 1.2px; text-transform: uppercase;
  display: block; margin-top: 1px;
}
.topbar-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}
.topbar-date {
  color: var(--fg2);
  font-size: 12px;
  font-family: var(--font-head);
}

/* ── LAYOUT ──────────────────────────────────────────── */
.layout {
  display: flex;
  flex: 1;
  overflow: hidden;
  min-height: 0;
}

/* ── SIDEBAR ─────────────────────────────────────────── */
.sidebar {
  width: 224px;
  flex-shrink: 0;
  background: var(--sidebar-bg);
  overflow-y: auto;
  overflow-x: hidden;
  padding: 12px 0 24px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.sidebar-section-label {
  font-size: 9px;
  font-weight: 600;
  font-family: var(--font-head);
  letter-spacing: 1.8px;
  text-transform: uppercase;
  color: var(--sidebar-fg);
  opacity: .7;
  padding: 12px 18px 4px;
  margin-top: 4px;
}

/* ── ÁREA CARD (accordion) ───────────────────────────── */
.area-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 14px 9px 18px;
  cursor: pointer;
  border: none;
  background: transparent;
  width: calc(100% - 16px);
  margin: 1px 8px;
  text-align: left;
  color: var(--sidebar-fg);
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 500;
  border-radius: var(--radius-sm);
  transition: background .15s, color .15s;
  position: relative;
}
.area-btn:hover { background: rgba(255,255,255,.07); color: var(--sidebar-act); }
.area-btn.open { background: rgba(255,255,255,.12); color: var(--sidebar-act); font-weight: 600; }
.area-icon {
  width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
  flex-shrink: 0;
}
.area-chevron {
  margin-left: auto;
  color: var(--sidebar-fg);
  opacity: .5;
  font-size: 10px;
  transition: transform .2s;
}
.area-btn.open .area-chevron { transform: rotate(90deg); opacity: .9; }

/* ── SUB-MENU ────────────────────────────────────────── */
.area-submenu {
  display: none;
  flex-direction: column;
  gap: 1px;
  padding: 2px 0 4px 0;
}
.area-submenu.open { display: flex; }
.sub-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 14px 7px 46px;
  cursor: pointer;
  border: none;
  background: transparent;
  width: calc(100% - 16px);
  margin: 0 8px;
  text-align: left;
  color: var(--sidebar-fg);
  font-family: var(--font-body);
  font-size: 12.5px;
  font-weight: 400;
  border-radius: var(--radius-sm);
  transition: background .12s, color .12s;
}
.sub-btn:hover { background: rgba(255,255,255,.07); color: var(--sidebar-act); }
.sub-btn.active {
  color: var(--sidebar-act);
  background: rgba(255,255,255,.14);
  font-weight: 600;
}
.sub-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: currentColor;
  opacity: .4;
  flex-shrink: 0;
}
.sub-btn.active .sub-dot { background: var(--accent); opacity: 1; }

/* ── MAIN CONTENT ────────────────────────────────────── */
.main {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  background: var(--bg);
  display: flex;
  flex-direction: column;
}
.page { display: none; flex-direction: column; flex: 1; padding: 24px; gap: 20px; }
.page.active { display: flex; }

/* ── PAGE HEADER ─────────────────────────────────────── */
.page-header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.page-title { font-size: 20px; font-weight: 700; }
.page-sub { color: var(--fg2); font-size: 13px; margin-top: 2px; }
.page-actions { margin-left: auto; display: flex; gap: 8px; }

/* ── BUTTONS ─────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px; border-radius: 7px; border: none;
  font-family: inherit; font-size: 13px; font-weight: 500;
  cursor: pointer; transition: .15s;
}
.btn { font-family: var(--font-body); border-radius: var(--radius-sm); }
.btn-primary { background: var(--brand); color: #fff; }
.btn-primary:hover { opacity: .88; }
.btn-accent  { background: var(--accent); color: #fff; }
.btn-ghost {
  background: transparent; color: var(--fg2);
  border: 1px solid var(--border);
}
.btn-ghost:hover { background: var(--bg2); color: var(--fg); }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-danger { background: var(--red-bg); color: var(--red); border: 1px solid transparent; }
.btn-danger:hover { opacity: .85; }

/* ── KPI TILES ───────────────────────────────────────── */
.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kpi {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  box-shadow: var(--shadow-sm);
}
.kpi-label { font-size: 11px; font-weight: 600; font-family: var(--font-head); letter-spacing: .8px; text-transform: uppercase; color: var(--fg3); margin-bottom: 6px; }
.kpi-value { font-size: 24px; font-weight: 700; font-family: var(--font-head); font-variant-numeric: tabular-nums; line-height: 1; color: var(--fg); }
.kpi-sub { font-size: 11px; color: var(--fg3); margin-top: 4px; font-family: var(--font-head); }
.kpi-blue  { border-top: 3px solid var(--brand); }
.kpi-green { border-top: 3px solid var(--green); }
.kpi-yellow{ border-top: 3px solid var(--yellow); }
.kpi-red   { border-top: 3px solid var(--red); }
.kpi-orange{ border-top: 3px solid var(--accent); }
.kpi-purple{ border-top: 3px solid var(--purple); }
.kpi-teal  { border-top: 3px solid var(--teal); }

/* ── CRM ─────────────────────────────────────────────── */
.crm-toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.crm-search {
  flex: 1;
  min-width: 200px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 13px;
  padding: 8px 12px;
  outline: none;
  box-shadow: var(--shadow-sm);
}
.crm-search:focus { border-color: var(--brand-light); }
.crm-search::placeholder { color: var(--fg3); }

.crm-filter {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 13px;
  padding: 7px 10px;
  outline: none;
  cursor: pointer;
}

/* Import zone */
.import-zone {
  background: var(--card);
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 20px;
  text-align: center;
  transition: .2s;
  box-shadow: var(--shadow-sm);
}
.import-zone.drag-over { border-color: var(--accent); background: var(--accent-soft); }
.import-zone p { color: var(--fg2); font-size: 13px; margin-top: 8px; }
.import-zone small { color: var(--fg3); font-size: 11px; }

/* Pipeline tabs */
.pipeline-tabs {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  padding-bottom: 2px;
  scrollbar-width: none;
}
.pipeline-tabs::-webkit-scrollbar { display: none; }
.tab-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 7px;
  border: 1px solid transparent;
  background: none;
  color: var(--fg2);
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: .15s;
}
.tab-btn:hover { background: var(--card); color: var(--fg); border-color: var(--border); }
.tab-btn.active { background: var(--card); border-color: var(--border); color: var(--fg); box-shadow: var(--shadow-sm); }
.tab-count {
  background: var(--bg2);
  color: var(--fg3);
  border-radius: 10px;
  padding: 1px 7px;
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}
.tab-btn.active .tab-count { background: var(--brand); color: #fff; }

/* Stage badges */
.stage-badge {
  display: inline-flex;
  align-items: center;
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 20px;
}
.s0 { background: var(--bg2); color: var(--fg3); }
.s1 { background: var(--blue-bg); color: var(--blue); }
.s2 { background: var(--yel-bg); color: var(--yellow); }
.s3 { background: rgba(107,70,193,.12); color: var(--purple); }
.s4 { background: rgba(224,123,57,.12); color: var(--accent); }
.s5 { background: var(--green-bg); color: var(--green); }
.s6 { background: var(--green-bg); color: var(--green); }
.s7 { background: var(--red-bg); color: var(--red); text-decoration: line-through; }

/* Lead cards */
.leads-list { display: flex; flex-direction: column; gap: 8px; }
.lead-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: border-color .15s, box-shadow .15s;
  box-shadow: var(--shadow-sm);
}
.lead-card:hover { border-color: var(--brand-light); box-shadow: var(--shadow); }
.lead-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  cursor: pointer;
}
.lead-avatar {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: var(--brand);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 13px;
  flex-shrink: 0;
  color: rgba(255,255,255,.9);
}
.lead-info { flex: 1; min-width: 0; }
.lead-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lead-contact { font-size: 12px; color: var(--fg2); margin-top: 2px; }
.lead-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.lead-value { font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; color: var(--green); }
.lead-chevron { color: var(--fg3); font-size: 11px; transition: transform .2s; }
.lead-card.expanded .lead-chevron { transform: rotate(90deg); }

/* Lead body (expandable) */
.lead-body {
  display: none;
  border-top: 1px solid var(--border);
  background: var(--bg);
  padding: 16px;
  gap: 16px;
  flex-direction: column;
}
.lead-card.expanded .lead-body { display: flex; }

.lead-meta { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.meta-item label { font-size: 11px; color: var(--fg3); font-weight: 500; letter-spacing: .3px; text-transform: uppercase; }
.meta-item p { font-size: 13px; color: var(--fg); margin-top: 3px; }

.lead-stage-select {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 13px;
  padding: 8px 10px;
  outline: none;
  cursor: pointer;
}
.lead-stage-select:focus { border-color: var(--brand-light); }

/* Log */
.log-list { display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow-y: auto; }
.log-entry {
  display: flex; align-items: flex-start; gap: 8px;
  font-size: 12px; color: var(--fg2);
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
}
.log-entry:last-child { border-bottom: none; }
.log-icon { font-size: 14px; width: 20px; flex-shrink: 0; text-align: center; }
.log-text { flex: 1; min-width: 0; line-height: 1.4; }
.log-date { font-size: 11px; color: var(--fg3); white-space: nowrap; flex-shrink: 0; font-family: var(--font-head); }

.log-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
.log-form select, .log-form input, .log-form textarea {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 12px;
  padding: 6px 10px;
  outline: none;
}
.log-form select:focus, .log-form input:focus, .log-form textarea:focus { border-color: var(--brand-light); }
.log-form textarea { resize: vertical; min-height: 56px; flex: 1; min-width: 180px; }

.obs-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 13px;
  padding: 8px 12px;
  width: 100%;
  resize: vertical;
  min-height: 60px;
  outline: none;
}
.obs-box:focus { border-color: var(--accent); color: var(--fg); }

.lead-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

/* Next contact */
.next-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.next-row label { font-size: 12px; color: var(--fg3); white-space: nowrap; }
.next-row input, .next-row select {
  background: var(--card2);
  border: 1px solid var(--border2);
  border-radius: 7px;
  color: var(--fg);
  font-family: inherit;
  font-size: 12px;
  padding: 5px 8px;
  outline: none;
}
.next-row input:focus, .next-row select:focus { border-color: var(--brand-light); }

/* ── ADD LEAD MODAL ──────────────────────────────────── */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  width: 100%;
  max-width: 480px;
  max-height: 90vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
  box-shadow: 0 8px 40px rgba(0,0,0,.18);
}
.modal h3 { font-size: 16px; font-weight: 700; font-family: var(--font-head); }
.modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal-grid .full { grid-column: 1/-1; }
.field label { display: block; font-size: 12px; color: var(--fg2); margin-bottom: 5px; font-weight: 600; font-family: var(--font-head); letter-spacing: .3px; }
.field input, .field select, .field textarea {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 13px;
  padding: 8px 11px;
  outline: none;
  transition: border-color .15s;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--brand-light); }
.field textarea { resize: vertical; min-height: 70px; }
.modal-footer { display: flex; gap: 8px; justify-content: flex-end; }

/* ── IMPORT MODAL ────────────────────────────────────── */
.import-map { display: flex; flex-direction: column; gap: 10px; max-height: 300px; overflow-y: auto; }
.map-row { display: grid; grid-template-columns: 1fr 16px 1fr; align-items: center; gap: 8px; font-size: 13px; }
.map-row span { color: var(--fg2); text-align: center; }
.map-row select { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--fg); font-family: var(--font-body); font-size: 12px; padding: 5px 8px; outline: none; }
.map-row select:focus { border-color: var(--brand-light); }
.map-col-label { font-size: 12px; color: var(--fg); font-weight: 600; font-family: var(--font-head); }

/* ── TOAST ───────────────────────────────────────────── */
.toast {
  position: fixed;
  bottom: max(24px, env(safe-area-inset-bottom, 0px));
  right: 24px;
  background: var(--fg);
  color: var(--bg);
  border-radius: var(--radius);
  padding: 10px 18px;
  font-size: 13px;
  font-family: var(--font-body);
  z-index: 500;

<script>
/* ============================================================
   DATA & PERSISTENCE
   ============================================================ */
const AREAS = [
  {
    id: 'comercial', label: 'Comercial', icon: '📈',
    subs: [
      { id: 'com-dash', label: 'Dashboard', icon: '📊' },
      { id: 'com-crm',  label: 'CRM',       icon: '🎯' },
    ]
  },
  {
    id: 'financeiro', label: 'Financeiro', icon: '💰',
    subs: [
      { id: 'fin-dash',  label: 'Dashboard',  icon: '📊' },
      { id: 'fin-lancamentos', label: 'Lançamentos', icon: '📝' },
    ]
  },
  {
    id: 'rh', label: 'RH', icon: '👥',
    subs: [
      { id: 'rh-dash', label: 'Dashboard', icon: '📊' },
      { id: 'rh-colaboradores', label: 'Colaboradores', icon: '🪪' },
    ]
  },
  {
    id: 'operacional', label: 'Operacional', icon: '⚙️',
    subs: [
      { id: 'op-dash', label: 'Dashboard', icon: '📊' },
      { id: 'op-processos', label: 'Processos', icon: '🔄' },
    ]
  },
  {
    id: 'marketing', label: 'Marketing', icon: '📣',
    subs: [
      { id: 'mkt-plano', label: 'Planejamento', icon: '🧭' },
      { id: 'mkt-cal',   label: 'Calendário',   icon: '🗓️' },
    ]
  },
];

/* ── CRM store ─────────────────────────────────────────── */
const KEY_CRM = 'ark_crm_v2';
let leads = [];

function loadLeads() {
  try { leads = JSON.parse(localStorage.getItem(KEY_CRM)) || []; } catch { leads = []; }
}
function saveLeads() {
  try { localStorage.setItem(KEY_CRM, JSON.stringify(leads)); } catch {}
}
function nextId() {
  return 'l' + Date.now() + Math.random().toString(36).slice(2,6);
}

const STAGES = [
  'Não iniciado',
  '1º contato tentado',
  'Em abordagem',
  'Proposta enviada',
  'Negociando',
  'Fechado (falta formalizar)',
  'Ativo',
  'Perdido',
];

/* ── Financial store ────────────────────────────────────── */
const KEY_FIN = 'ark_fin_v2';
let lancamentos = [];
function loadFin() { try { lancamentos = JSON.parse(localStorage.getItem(KEY_FIN)) || []; } catch { lancamentos = []; } }
function saveFin() { try { localStorage.setItem(KEY_FIN, JSON.stringify(lancamentos)); } catch {} }

/* ── RH store ────────────────────────────────────────────── */
const KEY_RH = 'ark_rh_v2';
let colaboradores = [];
function loadRH() { try { colaboradores = JSON.parse(localStorage.getItem(KEY_RH)) || []; } catch { colaboradores = []; } }
function saveRH() { try { localStorage.setItem(KEY_RH, JSON.stringify(colaboradores)); } catch {} }

/* ============================================================
   NAV — build sidebar
   ============================================================ */
let currentPage = 'home';

function buildNav() {
  const nav = document.getElementById('areas-nav');
  nav.innerHTML = '';

  AREAS.forEach(area => {
    // Area button
    const btn = document.createElement('button');
    btn.className = 'area-btn';
    btn.id = 'area-btn-' + area.id;
    btn.innerHTML = `
      <span class="area-icon">${area.icon}</span>
      <span class="area-label">${area.label}</span>
      <span class="area-chevron">▶</span>
    `;
    btn.onclick = () => toggleArea(area.id);
    nav.appendChild(btn);

    // Submenu
    const submenu = document.createElement('div');
    submenu.className = 'area-submenu';
    submenu.id = 'sub-' + area.id;

    area.subs.forEach(sub => {
      const sbtn = document.createElement('button');
      sbtn.className = 'sub-btn';
      sbtn.id = 'sub-btn-' + sub.id;
      sbtn.dataset.page = sub.id;
      sbtn.innerHTML = `<span class="sub-dot"></span><span class="sub-label">${sub.label}</span>`;
      sbtn.onclick = () => goPage(sub.id, area.id);
      submenu.appendChild(sbtn);
    });

    nav.appendChild(submenu);
  });
}

function toggleArea(areaId) {
  const btn = document.getElementById('area-btn-' + areaId);
  const sub = document.getElementById('sub-' + areaId);
  const isOpen = btn.classList.contains('open');

  // close all
  document.querySelectorAll('.area-btn').forEach(b => b.classList.remove('open'));
  document.querySelectorAll('.area-submenu').forEach(s => s.classList.remove('open'));

  if (!isOpen) {
    btn.classList.add('open');
    sub.classList.add('open');
  }
}

function goPage(pageId, areaId) {
  currentPage = pageId;

  // nav highlight
  document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
  const sbtn = document.getElementById('sub-btn-' + pageId);
  if (sbtn) sbtn.classList.add('active');

  // open area
  if (areaId) {
    document.querySelectorAll('.area-btn').forEach(b => b.classList.remove('open'));
    document.querySelectorAll('.area-submenu').forEach(s => s.classList.remove('open'));
    const abtn = document.getElementById('area-btn-' + areaId);
    const asub = document.getElementById('sub-' + areaId);
    if (abtn) abtn.classList.add('open');
    if (asub) asub.classList.add('open');
  }

  renderPage(pageId);
}

/* ============================================================
   PAGES — main render
   ============================================================ */
function renderPage(id) {
  const main = document.getElementById('pages');
  switch (id) {
    case 'home':          main.innerHTML = pageHome(); break;
    case 'com-dash':      main.innerHTML = pageComDash(); break;
    case 'com-crm':       main.innerHTML = pageCRM(); setupCRM(); break;
    case 'fin-dash':      main.innerHTML = pageFinDash(); break;
    case 'fin-lancamentos': main.innerHTML = pageLancamentos(); setupFin(); break;
    case 'rh-dash':       main.innerHTML = pageRHDash(); break;
    case 'rh-colaboradores': main.innerHTML = pageColaboradores(); setupRH(); break;
    case 'op-dash':       main.innerHTML = pageOpDash(); break;
    case 'op-processos':  main.innerHTML = pageProcessos(); break;
    case 'mkt-plano':     main.innerHTML = pageMktPlano(); renderMktPlano(); break;
    case 'mkt-cal':       main.innerHTML = pageMktCal(); renderMktCal(); break;
    default:              main.innerHTML = pageComingSoon(id); break;
  }
}

/* ── HOME ─────────────────────────────────────────────── */
function pageHome() {
  loadLeads(); loadFin(); loadRH();
  const rec = lancamentos.filter(l => l.tipo === 'Receita').reduce((s,l) => s + (+l.valor||0), 0);

function fmtK(n) {
  if (n >= 1000000) return (n/1000000).toFixed(1)+'M';
  if (n >= 1000) return (n/1000).toFixed(1)+'k';
  return n.toFixed(0);
}

let crmSearch = '', crmStageFilter = -1;

function pageCRM() {
  return `

    <div class="page-header">
      <div>
        <div class="page-title">CRM Geral</div>

      </div>
      <div class="page-actions">

function setupCRM() {
  loadLeads();
  crmSearch = '';
  crmStageFilter = -1;
  // drop zone
  const dz = document.getElementById('dropZone');
  if (dz) {
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
    dz.addEventListener('drop', e => {
      e.preventDefault(); dz.classList.remove('drag-over');
      const f = e.dataTransfer.files[0];
      if (f) parseSpreadsheet(f);
    });
  }

}

function crmSearchChange(v) { crmSearch = v; renderCRM(); }
function crmStageChange(v) { crmStageFilter = parseInt(v); renderCRM(); }

function renderCRM() {
  renderCRMKPIs();
  renderCRMTabs();
  renderCRMList();
}

function getFilteredLeads() {
  return leads.filter(l => {
    const q = crmSearch.toLowerCase();
    const matchQ = !q || l.empresa.toLowerCase().includes(q) || (l.contato||'').toLowerCase().includes(q) || (l.telefone||'').includes(q);
    const matchS = crmStageFilter < 0 || l.stage == crmStageFilter;
    return matchQ && matchS;
  });
}

function renderCRMKPIs() {
  const el = document.getElementById('crm-kpis');
  if (!el) return;
  const total = leads.length;
  const quentes = leads.filter(l => l.stage >= 3 && l.stage <= 4).length;
  const fechados = leads.filter(l => l.stage == 5 || l.stage == 6).length;
  const perdidos = leads.filter(l => l.stage == 7).length;
  const potencial = leads.filter(l => l.stage < 7).reduce((s,l) => s + (+l.valor||0), 0);
  el.innerHTML = `
    <div class="kpi kpi-blue"><div class="kpi-label">Total</div><div class="kpi-value">${total}</div><div class="kpi-sub">leads</div></div>

    <div class="kpi kpi-green"><div class="kpi-label">Fechados</div><div class="kpi-value">${fechados}</div><div class="kpi-sub">ativos + formalizando</div></div>
    <div class="kpi kpi-yellow"><div class="kpi-label">Perdidos</div><div class="kpi-value">${perdidos}</div><div class="kpi-sub">fora do pipeline</div></div>

function renderCRMTabs() {
  const el = document.getElementById('crm-tabs');
  if (!el) return;
  const counts = Array(8).fill(0);
  leads.forEach(l => { counts[l.stage] = (counts[l.stage]||0) + 1; });
  let html = `<button class="tab-btn ${crmStageFilter < 0 ? 'active':''}" onclick="crmTabAll()">Todos <span class="tab-count">${leads.length}</span></button>`;
  STAGES.forEach((s,i) => {
    html += `<button class="tab-btn ${crmStageFilter==i?'active':''}" onclick="crmTab(${i})">${s} <span class="tab-count">${counts[i]||0}</span></button>`;
  });
  el.innerHTML = html;
}

function crmTabAll() { crmStageFilter = -1; const s = document.getElementById('crmStageFilter'); if(s) s.value='-1'; renderCRM(); }
function crmTab(i) { crmStageFilter = i; const s = document.getElementById('crmStageFilter'); if(s) s.value=i; renderCRM(); }

function renderCRMList() {
  const el = document.getElementById('crm-list');
  if (!el) return;
  const list = getFilteredLeads();
  if (!list.length) {
    el.innerHTML = `<div class="empty-state"><div class="icon">🎯</div><h3>Nenhum lead encontrado</h3><p>Adicione seu primeiro lead ou ajuste os filtros.</p></div>`;

function toggleCard(id) {
  const c = document.getElementById('card-' + id);
  if (c) c.classList.toggle('expanded');
}

function addLog(lid) {
  const lead = leads.find(l => l.id === lid);
  if (!lead) return;
  const type  = document.getElementById('ltype-' + lid).value;
  const date  = document.getElementById('ldate-' + lid).value || new Date().toISOString().slice(0,10);
  const text  = document.getElementById('ltext-' + lid).value.trim();
  if (!text) { toast('Descreva o contato antes de registrar.'); return; }
  if (!lead.log) lead.log = [];
  lead.log.push({ type, date, text, id: nextId() });
  saveLeads();
  renderCRM();
  // re-expand
  setTimeout(() => {
    const c = document.getElementById('card-' + lid);
    if (c) c.classList.add('expanded');
  }, 10);
}

function deleteLead(id) {
  leads = leads.filter(l => l.id !== id);
  saveLeads();
  renderCRM();
  toast('Lead removido.');
}

function editLead(id) {

  editingLeadId = id;

  document.getElementById('mEmpresa').value  = l.empresa || '';
  document.getElementById('mContato').value  = l.contato || '';

  document.getElementById('mObs').value      = l.obs || '';

}

function closeLeadModal() { document.getElementById('leadModal').hidden = true; }

function saveLeadModal() {
  const empresa = document.getElementById('mEmpresa').value.trim();
  if (!empresa) { toast('Informe o nome da empresa ou pessoa.'); return; }
  const data = {
    empresa,
    contato:  document.getElementById('mContato').value.trim(),
    tipo:     document.getElementById('mTipo').value,
    telefone: document.getElementById('mTelefone').value.trim(),
    valor:    document.getElementById('mValor').value,
    stage:    parseInt(document.getElementById('mStage').value),
    obs:      document.getElementById('mObs').value.trim(),
    nextDate: document.getElementById('mNextDate').value,
    nextNote: document.getElementById('mNextNote').value.trim(),
  };

  if (editingLeadId) {
    const idx = leads.findIndex(l => l.id === editingLeadId);
    if (idx >= 0) leads[idx] = { ...leads[idx], ...data };
  } else {
    leads.push({ id: nextId(), log: [], ...data });
  }
  saveLeads();
  closeLeadModal();
  renderCRM();
  toast(editingLeadId ? 'Lead atualizado!' : 'Lead adicionado!');
}

/* ── EXCEL IMPORT ────────────────────────────────────────── */
let importData = [];    // raw parsed rows (objects)
let importHeaders = []; // column names

function openImportModal() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.xlsx,.xls,.csv';
  input.onchange = e => { if (e.target.files[0]) parseSpreadsheet(e.target.files[0]); };
  input.click();
}

function parseSpreadsheet(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      let wb;
      if (file.name.toLowerCase().endsWith('.csv')) {
        wb = XLSX.read(e.target.result, { type: 'string' });
      } else {
        wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      }
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
      if (!rows.length) { toast('Planilha vazia ou sem dados.'); return; }
      importData = rows;
      importHeaders = Object.keys(rows[0]);
      showImportModal();
    } catch (err) {
      toast('Erro ao ler arquivo: ' + err.message);
    }
  };
  if (file.name.toLowerCase().endsWith('.csv')) {
    reader.readAsText(file);
  } else {
    reader.readAsArrayBuffer(file);
  }
}

const CRM_FIELDS = [
  { key: 'empresa',  label: 'Empresa / Nome' },
  { key: 'contato',  label: 'Contato' },
  { key: 'tipo',     label: 'Tipo (Empresa/Pessoal)' },
  { key: 'telefone', label: 'Telefone' },
  { key: 'valor',    label: 'Valor (R$)' },
  { key: 'obs',      label: 'Observações' },
  { key: 'stage',    label: 'Etapa (0-7)' },
];

function showImportModal() {
  const map = document.getElementById('importMap');
  const opts = `<option value="">(ignorar)</option>` +
    importHeaders.map(h => `<option value="${esc(h)}">${esc(h)}</option>`).join('');

  map.innerHTML = CRM_FIELDS.map(f => {
    // auto-match by similarity
    const auto = importHeaders.find(h => h.toLowerCase().includes(f.key) || f.key.includes(h.toLowerCase())) || '';
    return `
    <div class="map-row">
      <span class="map-col-label">${f.label}</span>
      <span>←</span>
      <select id="imap-${f.key}">${opts.replace(`value="${esc(auto)}"`,`value="${esc(auto)}" selected`)}</select>
    </div>`;
  }).join('');

  // preview
  document.getElementById('importPreview').textContent =
    `${importData.length} linhas encontradas · Colunas: ${importHeaders.join(', ')}`;

  document.getElementById('importModal').hidden = false;
}

function closeImportModal() { document.getElementById('importModal').hidden = true; }

function doImport() {
  const mapping = {};
  CRM_FIELDS.forEach(f => {
    const sel = document.getElementById('imap-' + f.key);
    if (sel && sel.value) mapping[f.key] = sel.value;
  });

  if (!mapping.empresa) { toast('Mapeie pelo menos o campo "Empresa / Nome".'); return; }

  let added = 0;
  importData.forEach(row => {
    const empresa = String(row[mapping.empresa] || '').trim();
    if (!empresa) return;
    const lead = {
      id: nextId(),
      log: [],
      empresa,
      contato:  mapping.contato  ? String(row[mapping.contato]  || '').trim() : '',
      tipo:     mapping.tipo     ? String(row[mapping.tipo]      || '').trim() || 'Empresa' : 'Empresa',
      telefone: mapping.telefone ? String(row[mapping.telefone]  || '').trim() : '',
      valor:    mapping.valor    ? String(row[mapping.valor]     || '').replace(/[^0-9.,]/g,'').replace(',','.') : '',
      obs:      mapping.obs      ? String(row[mapping.obs]       || '').trim() : '',
      stage:    mapping.stage    ? Math.min(7, Math.max(0, parseInt(row[mapping.stage])||0)) : 0,
      nextDate: '',
      nextNote: '',
    };
    leads.push(lead);
    added++;
  });

  saveLeads();
  closeImportModal();
  renderCRM();
  toast(`${added} leads importados com sucesso!`);
}

        <div class="lead-avatar" style="background:${l.tipo==='Receita'?'#15803d':'#991b1b'}">${l.tipo==='Receita'?'+':'-'}</div>
        <div class="lead-info">
          <div class="lead-name">${esc(l.descricao||'Sem descrição')}</div>
          <div class="lead-contact">${esc(l.categoria||'')}${l.data?' · '+l.data:''}</div>
        </div>
        <div class="lead-right">
          <span class="lead-value" style="color:${l.tipo==='Receita'?'var(--green)':'var(--red)'}">
            ${l.tipo==='Receita'?'+':'-'}R$${fmtK(+l.valor||0)}
          </span>
          <button class="btn btn-danger btn-sm" onclick="delFin('${l.id}')">🗑</button>
        </div>
      </div>
    </div>`).join('')}</div>`;
}

function delFin(id) { lancamentos = lancamentos.filter(l=>l.id!==id); saveFin(); renderFin(); }
function openFinModal() {
  const desc = window.prompt('Descrição:');
  if (!desc) return;
  const tipo = window.confirm('É uma RECEITA? (Cancelar = Despesa)') ? 'Receita' : 'Despesa';
  const val  = parseFloat((window.prompt('Valor (R$):') || '0').replace(',','.')) || 0;
  const cat  = window.prompt('Categoria:') || 'Geral';
  lancamentos.push({ id: nextId(), descricao: desc, tipo, valor: val, categoria: cat, data: new Date().toISOString().slice(0,10) });
  saveFin(); renderFin(); toast('Lançamento registrado!');
}

  }
  el.innerHTML = `<div class="leads-list">${colaboradores.map(c=>`
    <div class="lead-card">
      <div class="lead-header" style="cursor:default">
        <div class="lead-avatar" style="background:var(--purple)">${(c.nome||'?').slice(0,2).toUpperCase()}</div>
        <div class="lead-info">
          <div class="lead-name">${esc(c.nome)}</div>
          <div class="lead-contact">${esc(c.cargo||'')}${c.departamento?' · '+esc(c.departamento):''}</div>
        </div>
        <div class="lead-right">
          <span class="stage-badge ${c.status==='Ativo'?'s6':'s7'}">${c.status||'Ativo'}</span>
          <button class="btn btn-danger btn-sm" onclick="delRH('${c.id}')">🗑</button>

}
function delRH(id) { colaboradores=colaboradores.filter(c=>c.id!==id); saveRH(); renderRH(); }
function openRHModal() {
  const nome = window.prompt('Nome:'); if(!nome) return;
  const cargo = window.prompt('Cargo:') || '';
  const dep = window.prompt('Departamento:') || '';
  colaboradores.push({id:nextId(),nome,cargo,departamento:dep,status:'Ativo'});
  saveRH(); renderRH(); toast('Colaborador cadastrado!');
}

  const max = Math.max(1, ...byStage);
  const colors = ['var(--fg3)','var(--accent)','var(--yellow)','var(--purple)','var(--red)','var(--green)','var(--teal)','#666'];
  return `
  <div class="page active">
    <div class="page-header">
      <div><div class="page-title">Comercial — Dashboard</div><div class="page-sub">Performance do pipeline</div></div>
      <div class="page-actions"><button class="btn btn-ghost btn-sm" onclick="goPage('com-crm','comercial')">Ver CRM</button></div>
    </div>
    <div class="kpi-row">
      <div class="kpi kpi-blue"><div class="kpi-label">Total leads</div><div class="kpi-value">${leads.length}</div></div>
      <div class="kpi kpi-red"><div class="kpi-label">Em negociação</div><div class="kpi-value">${leads.filter(l=>l.stage>=3&&l.stage<=4).length}</div></div>
      <div class="kpi kpi-green"><div class="kpi-label">Fechados</div><div class="kpi-value">${leads.filter(l=>l.stage==5||l.stage==6).length}</div></div>
      <div class="kpi kpi-teal"><div class="kpi-label">Potencial R$</div><div class="kpi-value">${fmtK(leads.filter(l=>l.stage<7).reduce((s,l)=>s+(+l.valor||0),0))}</div></div>
    </div>
    <div class="chart-row">
      <div class="chart-card" style="grid-column:1/-1">
        <h4>Leads por etapa</h4>
        <div class="mini-bar">
          ${STAGES.map((s,i)=>`
            <div class="mini-bar-row">
              <span class="mini-bar-label">${s}</span>
              <div class="mini-bar-track"><div class="mini-bar-fill" style="width:${(byStage[i]/max*100).toFixed(1)}%;background:${colors[i]}"></div></div>
              <span class="mini-bar-val">${byStage[i]}</span>
            </div>`).join('')}
        </div>
      </div>
    </div>
  </div>`;
}

const MKT_PILARES = {
  tese:    { nome:'Tese / polêmica',     cor:'#E07B39', obj:'Alcance, debate e compartilhamento' },
